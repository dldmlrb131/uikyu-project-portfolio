ections import defaultdict\n\ndef validate(records):\n    errors=[]; last={}; counts=defaultdict(int)\n    for line,row in enumerate(records,1):\n        if not isinstance(row,dict): errors.append(f'{line}: event must be an object'); continue\n        required=('episode_id','stream_id','measurement_time_ns','clock_id','frame_id','calibration_id','unit','value')\n        missing=[k for k in required if k not in row]\n        if missing: errors.append(f'{line}: missing {missing}'); continue\n        if any(not isinstance(row[k],str) or not row[k] for k in ('episode_id','stream_id','clock_id','frame_id','calibration_id','unit')):\n            errors.append(f'{line}: identifier and unit fields must be non-empty strings'); continue\n        stamp=row['measurement_time_ns']\n        if type(stamp) is not int or stamp<0: errors.append(f'{line}: invalid timestamp'); continue\n        key=(row['episode_id'],row['stream_id'],row['clock_id'])\n        if key in last and stamp<=last[key]: errors.append(f'{line}: non-increasing stream timestamp')\n        last[key]=stamp\n        val=row['value']\n        if not isinstance(val,list) or not val or not all(type(x) in (int,float) and math.isfinite(x) for x in val):\n            errors.append(f'{line}: value must be a non-empty finite numeric vector')\n        counts[row['stream_id']]+=1\n    return dict(events_by_stream=dict(counts),errors=errors,passed=not errors)\n\nif __name__=='__main__':\n    if len(sys.argv)!=2: raise SystemExit('Usage: python robot_data_quality.py events.jsonl')\n    try:\n        with open(sys.argv[1],encoding='utf-8') as f:\n            records=[json.loads(line) for line in f if line.strip()]\n        report=validate(records)\n        print(json.dumps(report,ensure_ascii=False,indent=2))\n        raise SystemExit(0 if report['passed'] else 1)\n    except (OSError,ValueError) as exc: raise SystemExit(str(exc))\n", "field": {"sources": [{"id": "ifcgeom", "title": "IfcOpenShell · geometry processing", "url": r('invalid height/bounds')\n    xmin,ymin,xmax,ymax=bounds\n    if xmax<=xmin or ymax<=ymin:raise ValueError('bounds need xmax>xmin,ymax>ymin')\n    w=math.ceil((xmax-xmin)/resolution);h=math.ceil((ymax-ymin)/resolution)\n    if w*h>max_cells:raise ValueError('map exceeds cell budget')\n    grid=bytearray([205])*(w*h)\n    def index(x,y):\n        if not(xmin<=x<xmax and ymin<=y<ymax):return None\n        ix=math.floor((x-xmin)/resolution);iy=math.floor((y-ymin)/resolution)\n        return (h-1-iy)*w+ix\n    for x,y in free:\n        k=index(x,y)\n        if k is not None:grid[k]=254\n    for x,y,z in points:\n        if zmin<=z<=zmax:\n            k=index(x,y)\n            if k is not None:grid[k]=0\n    return w,h,grid\n\ndef main():\n    a=argparse.ArgumentParser(description=__doc__)\n    a.add_argument('xyz_csv');a.add_argument('--observed-free',help='optional XY CSV; externally verified visible free samples')\n    a.add_argument('--resolution',type=float,default=.1);a.add_argument('--z-min',type=float,required=True);a.add_argument('--z-max',type=float,required=True)\n    a.add_argument('--bounds',type=float,nargs=4,required=True,metavar=('XMIN','YMIN','XMAX','YMAX'))\n    a.add_argument('--frame',required=True);a.add_argument('--map-version',required=True);a.add_argument('--output',default='map')\n    v=a.parse_args()\n    if not v.frame.strip() or not v.map_version.strip():a.error('frame/map-version must be nonempty')\n    points=read_points(v.xyz_csv,('x','y','z'));free=read_points(v.observed_free,('x','y')) if v.observed_free else []\n    w,h,grid=build(points,free,v.resolution,v.z_min,v.z_max,v.bounds)\n    out=Path(v.output)\n    if not out.name or any(c in out.name for c in ['\\n','\\r']):a.error('invalid output filename')\n    out.parent.mkdir(parents=True,exist_ok=True)\n    pgm=out.with_suffix('.pgm');yml=out.with_suffix('.yaml');meta=out.with_suffix('.json')\n    pgm.write_bytes(f'P5\\n{w} {h}\\n255\\n'.encode('ascii')+grid)\n    yml.write_text(f'image: {json.dumps(pgm.name)}\\nmode: trinary\\nresolution: {v.resolution}\\norigin: [{v.bounds[0]}, {v.bounds[1]}, 0.0]\\nnegate: 0\\noccupied_thresh: 0.65\\nfree_thresh: 0.196\\n',encoding='utf-8')\n    meta.write_text(json.dumps(dict(frame_id=v.frame,map_version=v.map_version,input=v.xyz_csv,observed_free=v.observed_free,bounds=v.bounds,z_band=[v.z_min,v.z_max],resolution=v.resolution,cells=dict(width=w,height=h),consumer_setup='Configure map_server frame_id to match this frame_id, provide validated TF and independent navigation checks.',status='engineering example; field validation required',missing='no raycasting, inflation, terrain, sensor uncertainty, dynamic update, localization or safety certification'),indent=2),encoding='utf-8')\n    print(f'Wrote {pgm}, {yml}, {meta}; unknown cells are preserved.')\n\nif __name__=='__main__':main()\n", "ifc_asset_extract.py": "\"\"\"IFC element metadata and placement export, not a navigation/task generator.\nDependency: an explicitly chosen compatible IfcOpenShell release.\nUsage: python ifc_asset_extract.py model.ifc assets.json\nNo geometry, georeference transform, tool target or reachability is inferred.\n\"\"\"\nimport json,sys\nfrom pathlib import Path\n\ndef extract(path):\n    import ifcopenshell\n    import ifcopenshell.util.unit\n    import ifcopenshell.util.placement\n    model=ifcopenshell.open(str(path))\n    scale=ifcopenshell.util.unit.calculate_unit_scale(model)\n    rows=[]\n    for element in model.by_type('IfcElement'):\n        placement=getattr(element,'ObjectPlacement',None)\n        # Unsupported placement types must be handled explicitly, not guessed.\n        supported=placement is not None and placement.is_a('IfcLocalPlacement')\n        matrix=ifcopenshell.util.placement.get_local_placement(placement) if supported else None\n        rows.append(dict(ifc_guid=element.GlobalId,ifc_class=element.is_a(),name=element.Name,placement_supported=supported,origin_in_ifc_project_m=[float(matrix[i,3])*scale for i in range(3)] if matrix is not None else None,rotation_rows=matrix[:3,:3].tolist() if matrix is not None else None,frame_id='ifc_project_local',observed_in_field=False,task_target_verified=False))\n    return dict(schema_version='ifc-asset-example-1',ifc_schema=model.schema,length_unit_to_m=scale,source_file=str(path),note='ObjectPlacement origin is not geometric center, site CRS or a robot target; validate nested placement/unit and separately apply georeferencing/site alignment.',elements=rows)\n\nif __name__=='__main__':\n    if len(sys.argv)!=3:raise SystemExit('Usage: python ifc_asset_extract.py model.ifc assets.json')\n    Path(sys.argv[2]).write_text(json.dumps(extract(sys.argv[1]),ensure_ascii=False,indent=2),encoding='utf-8')\n"}, "original_sha256": "63b213c8bb719c1e1283d8251af6b1a58cdf2f0e02b41c18f2cec9ea5f19ea1c", "atlas_image": "https://bostondynamics.com/wp-content/uploads/2025/12/atlas-hero-2026-scaled.jpg", "checked": "2026-11-01"}};

function download(name,content,type='application/json'){const u=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000);}
function hero(k,t,p){return `<div class="hero"><div class="eyebrow">${k}</div><h1>${t}</h1><p>${p}</p></div>`;}
function sourceLinks(ids){return `<div class="source-inline">${ids.map(id=>resource(id)).filter(Boolean).map(r=>`<a href="${r.url}" target="_blank" rel="noopener">${r.title} ↗</a>`).join('')}</div>`;}
function bullets(a){return '<ul>'+a.map(x=>'<li>'+x+'</li>').join('')+'</ul>';}
function steps(a){return a.map((x,i)=>`<div class="step-line"><span class="num">${i+1}</span><p>${x}</p></div>`).join('');}
function table(head,rows){return `<div class="table-wrap" tabindex="0" role="region" aria-label="데이터 표: ${esc(head.join(', '))}"><table><thead><tr>${head.map(x=>'<th>'+x+'</th>').join('')}</tr></thead><tbody>${rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')}</tbody></table></div>`;}
function flow(items){return `<div class="flow">${items.map((x,i)=>`${i?'<i>→</i>':''}${Array.isArray(x)?`<button data-skill="${x[0]}">${x[1]}</button>`:`<span>${x}</span>`}`).join('')}</div>`;}
function moduleButton(id){const s=findSkill(id),p=partBy(s.part);return `<button class="module-card" data-skill="${id}"><span class="module-icon">${p.short.slice(0,1)}</span><div><h3>${s.title}</h3><p>${s.expert.goal}</p></div><span class="arrow">›</span></button>`;}
function resourceCard(r){return `<article class="resource"><div class="row"><span class="badge blue">${r.kind}</span><span class="small muted">${r.stage}</span></div><h3>${r.title}</h3><p>${r.use}</p><p class="muted"><strong>적용 전 연결 작업</strong><br>${r.adapt}</p><a href="${r.url}" target="_blank" rel="noopener">공식 자료 열기 ↗</a><div class="rights">${r.rights}<br>공식 페이지 확인 ${r.checked} · 개별 release/데이터 도입 검증은 별도</div></article>`;}
function go(page,part,skill){const old=state.page;state.page=page;if(part)state.part=part;state.skill=skill||null;state.query='';$('#search').value='';render();const h=new URLSearchParams({page:state.page,part:state.part});if(state.skill)h.set('skill',state.skill);history.replaceState(null,'','#'+h);if(old!==page)window.scrollTo(0,0);else if(page==='body'&&matchMedia('(max-width:950px)').matches)document.querySelector('.crumb')?.scrollIntoView({block:'start'});}

function modulePage(s,p){const e=s.expert;const tabs=[['overview','실무 개요'],['contract','데이터 계약'],['implementation','구현·보정'],['validation','검증·진단'],['references','도구·근거']];let content='';if(state.tab==='overview')content=`<div class="card"><h3>구현 목표</h3><p class="lead">${e.goal}</p><h3 style="margin-top:24px">이 모듈이 연결하는 것</h3>${table(['들어오는 정보','모양·단위','역할'],s.rows)}<div class="callout"><strong>다음 모듈에 전달</strong><p>${s.action}</p></div><h3>완료 시 남겨야 할 산출물</h3>${bullets(e.artifacts)}<details><summary>직관적으로 이해하기</summary><div><p>${s.child}</p><p class="muted">현장 예: ${s.example}</p></div></details></div>`;

if(state.tab==='references')content=`<div class="resource-grid">${e.tools.map(resource).filter(Boolean).map(resourceCard).join('')}</div><div class="card section"><h3>기존 해설의 연구 근거</h3>${s.refs.map(i=>`<p><a target="_blank" rel="noopener" href="${DATA.sources[i].url}">${DATA.sources[i].title} ↗</a><br><span class="small muted">${DATA.sources[i].note}</span></p>`).join('')}<p class="small muted">구현 절차와 검증 항목은 문헌·공식 인터페이스를 바탕으로 구성한 설계 제안입니다. 해당 환경의 실제 결과로 검증해야 합니다.</p></div>`;
return `<div class="hero-row"><div><span class="badge blue">ENGINEERING MODULE</span><h2 style="margin-top:12px">${s.title}</h2></div><div class="row"><button class="btn" data-bookmark="${s.id}" aria-pressed="${saved.bookmarks.includes(s.id)}">${saved.bookmarks.includes(s.id)?'저장됨 ✓':'모듈 저장'}</button><button class="btn ghost" data-part="${p.id}">목록</button></div></div><div class="tabs" aria-label="모듈 상세 내용">${tabs.map(([id,t])=>`<button data-tab="${id}" class="${state.tab===id?'active':''}" aria-pressed="${state.tab===id}">${t}</button>`).join('')}</div>${content}`;}

function contractsPage(){return hero('DATA CONTRACTS','단위·좌표·시간·오차를 하나의 계약으로','인식·제어·데이터 팀 사이에서 깨지기 쉬운 연결을 고정합니다. 장비 원본, 추정 상태, 정책 행동, 작업 결과는 서로 다른 스키마입니다.')+`<div class="grid2"><div class="card"><h2>원시값과 추정값 분리</h2><p>깊이 센서 출력, 물체 자세 추정, LLM의 설명을 같은 “정답”으로 저장하지 않습니다. 원시 관측과 파생값에 각각 출처와 버전을 둡니다.</p>${flow(['raw','calibrated','estimated','commanded','observed result'])}</div><div class="card"><h2>행동 표현을 먼저 고정</h2><p>절대 관절각·관절 속도·손끝 delta pose·절대 pose·토크는 다른 행동입니다. frame, 회전 표현, 그리퍼 부호, 적용 기간을 함께 명시합니다.</p><button class="link-button" data-skill="vla">action adapter 설계 →</button></div></div><div class="section card"><h2>공통 데이터 계약 체크</h2>${table(['구분','계약에 들어갈 것','검사 방법'],[['시각','측정·수신 시각, clock domain, offset, dropout','순서·스큐·age 분포와 clock jump 주입'],['공간','frame_id, transform 방향, 축, 길이·회전 단위','독립 타깃·역변환·체인 합성 시험'],['센서','encoding, shape, 유효 마스크, 포화·결측','알려진 입력·범위 밖·고장 데이터 시험'],['추정','covariance, 관측 출처, 최신성','잔차·일관성·OOD·센서 유실 평가'],['행동','delta/absolute, joint order, horizon, limits','adapter round-trip·실제 추종 비교'],['계보','원본 hash, 보정·기구·코드·모델 revision','replay·파생 데이터 재생성 비교']])}</div><div class="section card"><h2>카메라 픽셀에서 손 목표까지</h2>${flow([['depth','깊이 단위 확인'],['pose','대상 표면/자세'],['frames','시각에 맞는 좌표 변환'],['reach','IK·충돌·궤적'],['grip','접촉·유지 확인']])}<pre>조건: 왜곡 보정된 픽셀 (u,v), 카메라 optical frame, 광학축 깊이 Z [m]
X = (u - cx) * Z / fx
Y = (v - cy) * Z / fy
p_base = R_base_camera * [X,Y,Z] + t_base_camera

주의: 사선거리(range)는 광학축 깊이(Z)와 다르다.
      fx,fy,cx,cy는 현재 해상도·ROI·보정에 맞아야 한다.
      손목 카메라는 관측 시각의 관절 상태·변환이 필요하다.</pre>${sourceLinks(['opencv','rep118','tf2'])}</div><div class="grid2 section"><div class="card"><h3>보정 실무 순서</h3>${steps(['카메라 내부값·렌즈 모델·해상도 확인','고정/손목 구조에 맞는 외부·hand-eye 보정','TCP·힘 영점·도구 질량·CoM 보정','보정에 쓰지 않은 타깃으로 독립 검사','장착·도구·모델 변경 시 버전 갱신'])}</div><div class="card"><h3>오차 예산</h3><p>센서 해상도가 곧 손끝 정확도는 아닙니다. 깊이·자세·외부 보정·TCP·기구·추종·지연·접촉 오차를 전체 과제에서 봅니다.</p><p><strong>예시:</strong> 병진 시간오차 ≈ 속도×스큐. 회전하는 센서는 센서와 회전축의 거리도 영향을 줍니다.</p><p class="muted small">독립·작은·영평균 오차라는 가정이 확인될 때 공분산 전파 등을 사용합니다. 공통 편향·같이 틀리는 오차를 독립 RSS로 합치지 않습니다.</p><button class="btn ghost" data-page="evaluation">오차 계산 도구 →</button></div></div><div class="section card"><h3>인터페이스 책임 표</h3>${table(['산출물','생산 책임','소비 책임'],[['보정·frame tree','센서/로봇 통합 담당','인식·계획 담당이 독립 타깃으로 검증'],['관측·action 계약','데이터/제어 담당 공동','학습 담당이 normalization·단위를 대조'],['기술 성공·실패·cancel','제어/작업 기술 담당','에이전트 담당이 상태 전이·재시도에 반영'],['완료 증거','독립 검사 모듈/현장 절차','제품 담당이 업무 성공과 연결']])}</div>`;}
function pipelinePage(){return hero('DATA ENGINEERING','원본 기록에서 학습·배포까지','데이터 양보다 동작의 의미와 재현성을 먼저 확보합니다. bag/MCAP은 원본 replay, episode 포맷은 학습 목적에 맞게 연결합니다.')+`<div class="card">${flow(['수집','원본·보정 snapshot','QC','정렬·episode','분리·정규화','학습','별도 평가','배포·복구'])}<h2>단계마다 남길 것</h2>${table(['단계','처리','산출물·실패 검사'],[['수집','필수 토픽·측정 시각·행동·사람 개입 기록','토픽/장치 목록, QoS, 유실률, 디스크 처리량'],['원본','압축·스키마·보정·설정·권리 보존','원본 checksum, 기록기/장비 revision'],['QC','단위·형상·finite·순서·스큐·포화·TF 검사','pass/fail과 이유, 제외·수정 내역'],['정렬','정책 시각에 센서·action 대응, episode 경계','보간/nearest 방법, max skew, 터미널·성공 라벨'],['분리','episode·물체·장소·날짜별 홀드아웃','분할 manifest, 중복/누수 검사'],['학습','관측/행동 adapter, train 통계 normalization','환경·config·seed·코드·checkpoint revision'],['평가','같은 조건의 규칙/BC/정책 기준선 비교','작업·환경별 성공, 개입, 손상, 지연'],['운영','canary·장애 추적·이전 버전 복귀','모델+보정+driver+설정 묶음·운영 사건']])}</div><div class="grid2 section"><div class="card"><h3>저장 포맷 선택</h3><p><strong>rosbag2 / MCAP:</strong> 원시 다중 시계열과 replay.<br><strong>LeRobot:</strong> 관측·행동·영상·episode 메타데이터를 정책 학습에 연결.<br><strong>robomimic:</strong> 시연 학습 실험과 정해진 관측/action 구조.</p><p class="small muted">컨테이너 변환만으로 좌표·행동 의미가 통일되지는 않습니다. LeRobot v3의 episode 인덱스를 파일 이름만으로 재구성하지 말고 메타데이터를 사용하세요.</p>${sourceLinks(['rosbag','mcap','lerobot','robomimic'])}</div><div class="card"><h3>필요한 데이터를 표적으로 수집</h3><ul><li>접촉력이 부족하면 영상 수를 늘리기보다 접촉·실측 하중 확보.</li><li>복구가 약하면 실패 전후와 사람 수정 행동 확보.</li><li>현장 전이가 약하면 조명·배치·물체·센서 배치를 별도 평가.</li><li>변형 물체는 형상뿐 아니라 접촉·상태 변화 관측.</li></ul><p class="small muted">공개 데이터는 사전학습·기준선·수집 설계에 유용합니다. 해당 장비의 action·힘·지연을 포함하지 않으면 현장 데이터를 보충해야 합니다.</p></div></div><div class="section card"><h2>내려받아 실행하는 최소 데이터 QC</h2><p>프로젝트 예시 JSONL의 필수 필드·시각 단조성·finite 값을 검사합니다. 표준 라이브러리만 사용하며 로봇 연결은 없습니다. 전체 데이터 품질을 보증하는 도구는 아니고 팀의 QC를 확장할 출발점입니다.</p><div class="row"><button class="btn primary" data-download="qc">Python 검사기</button><button class="btn ghost" data-download="sample">예시 JSONL</button><button class="btn" data-download="manifest">manifest 템플릿</button></div><pre>python robot_data_quality.py events.sample.jsonl
# events_by_stream, errors, passed 출력
# 오류가 있으면 종료 코드 1
# 추가할 검사: 최대 스큐, TF coverage, 센서 범위,
# episode 경계, action 의미, 데이터 권리, split leakage</pre><details><summary>검사기 코드 보기</summary><div><pre>${esc(DATA.qc_code)}</pre></div></details></div><div class="section card"><h2>수집 용량 계산</h2><p class="small muted">압축하지 않은 RGB uint8 + 16-bit depth만 계산합니다. 메타데이터·관절·촉각·인덱스·복제·실제 codec은 별도로 산정합니다.</p><div class="form-grid">${input('camW','영상 폭 px',640,1,8000)}${input('camH','영상 높이 px',480,1,8000)}${input('camFps','프레임/초',30,1,1000)}${input('camCount','RGB+depth 센서 쌍 수',2,1,30)}${input('hours','기록 시간 h',8,0.1,1000,0.1)}</div><div class="calc-result" id="storageResult" aria-live="polite"></div></div>`;}

  "task_id": "task-001",
  "world_version": 42,
  "tool": "pick_and_place",
  "arguments": {"object_id": "cup_A", "destination_id": "box_B"},

  "config_ref": "validated-cell-config-v3",
  "timeout_policy_ref": "cell-time-budget-v1",
  "runtime_checks": ["obstacle", "force", "sensor_age", "deadline"],
  "verify": "object_stably_inside_box",
  "on_failure": "return_observed_error"
}</pre><p class="small muted">교육용 계약 예입니다. 실제 tool schema·검사 코드·장비 설정이 필요합니다. 임계값을 자연어 모델이 즉석에서 생성해 장비에 적용하지 않도록 구성합니다.</p><h3>상태 전이</h3>${flow(['VALIDATE','EXECUTE','VERIFY','DONE'])}${flow(['실패·상태 변화','RECOVER','재관측·재계획 또는 도움 요청'])}</div><div class="grid2 section"><div class="card"><h3>능동성에 필요한 데이터</h3>${bullets(['지속 목표·완료 조건·우선순위·실행 한계','가용 기술의 입출력·전제·실패·cancel 의미','시각·오차·frame·health가 있는 현장 상태','모델·보정·기구·툴 설정 버전','행동별 관측 결과와 복구·개입 이력'])}</div><div class="card"><h3>오류를 설계에 포함</h3>${table(['상황','실행기의 처리'],[['대상 여러 개','ID를 확정하기 전 질문'],['stale sensor / world version 변경','재관측·전제 재검사'],['접촉 실패','허용 범위의 복구·제한된 재시도'],['클라우드 끊김','로컬에 정의된 hold/stop/완료 범위 적용'],['ACK만 수신','VERIFY로 이동해 실제 결과 확인']])}</div></div><div class="section card"><h2>정책 도입 경로 선택</h2>${table(['경로','적합한 출발','추가 데이터·검증'],[['기존 기술 + LLM 감독','반복 작업·알려진 도구·명확한 제약','기술 계약·완료 검사·모호/불가 요청 벤치마크'],['BC/시연 학습','시연 가능한 좁은 조작','동기화 obs-action·복구·행동 adapter·정규화'],['사전학습 VLA 미세조정','지원 몸·관측/action이 근접한 작업','로봇별 adapter·지원 checkpoint·현장 OOD 평가'],['RL/모델 기반 제어','접촉·동역학·제어 목표를 시험 가능','동역학·보상/비용·sim-real·안정성 검증']])}<div class="row" style="margin-top:16px"><button class="btn ghost" data-skill="language">목표 해석 모듈</button><button class="btn ghost" data-skill="executive">작업 감독 모듈</button><button class="btn ghost" data-skill="vla">VLA 모듈</button></div></div>`;}
function evaluationPage(){return hero('VALIDATION WORKBENCH','모델 점수를 작업 품질로 연결하기','단일 성공률 대신 조건·표본·실패·지연·원가를 함께 봅니다. 아래 계산은 설계 보조이며 실측 보고서를 대신하지 않습니다.')+`<div class="card"><h2>평가 매트릭스</h2>${table(['범위','분리할 조건','측정'],[['인식·기하','조명·거리·재질·가림·배치','precision/recall·pose error·valid ratio·지연'],['제어·접촉','하중·마찰·공차·속도·기구 변화','TCP 오차·peak force·overshoot·미끄러짐'],['전체 작업','준비·실행·검사·복구 포함','업무 성공·오완료·손상·개입·cycle time'],['운영','장시간·센서 누락·통신·재시작','deadline miss·MTTR·복귀·에너지·재작업'],['전이','물체·장소·날짜·장비 홀드아웃','기준선 대비 성능·새 실패·재학습 비용']])}<div class="callout"><p><strong>분모를 고정하세요.</strong> 전체 요청, 실행 가능 요청, 실제 실행, 성공 실행을 구분하고 중단·사람 개입·재시도를 어떻게 세는지 명시합니다. 정책의 동일한 실패를 반복해 표본 수만 늘리는 평가를 피합니다.</p></div></div><div class="grid2 section"><div class="card"><h3>성공률의 불확실성</h3><p class="small muted">성공/실패가 독립이며 같은 성공 확률을 가진다는 이항 가정의 Wilson 95% 구간입니다. 현장·물체별 의존성이 크면 별도 층화·군집 평가가 필요합니다.</p><div class="form-grid">${input('trials','시험 수 n',100,1,1000000)}${input('successes','성공 수 x',90,0,1000000)}</div><div class="calc-result" id="wilsonResult" aria-live="polite"></div></div><div class="card"><h3>시간 정렬 오차 근사</h3><p class="small muted">일정 속도·작은 회전의 1차 상계 근사. 회전 방향·센서 위치·가속·제어 추종 등은 실제 시스템 모델로 검증해야 합니다.</p><div class="form-grid">${input('velocity','병진 속도 m/s',0.5,0,100,0.1)}${input('skew','시간 스큐 ms',20,0,10000,1)}${input('omega','각속도 rad/s',0.5,0,100,0.1)}${input('lever','회전축에서 센서 거리 m',0.2,0,100,0.1)}</div><div class="calc-result" id="errorResult" aria-live="polite"></div></div></div><div class="section card"><h2>실패 분석을 개선 요청으로</h2>${table(['관측된 실패','먼저 분리할 원인','우선 조치'],[['손이 항상 같은 만큼 빗나감','보정·축·TCP 편향','독립 타깃 재검증, 모델 학습 전에 기하 수정'],['움직일 때만 어긋남','시각·회전·rolling shutter·추종','측정/수신 시각·TF·모터 상태 비교'],['잡았지만 운반 중 낙하','힘·마찰·가속·접촉 위치','파지 envelope와 동적 검증'],['학습 점수 높고 새 현장에서 실패','leakage·분포·action mismatch','분할·normalization·adapter 재검사'],['끝났다고 했지만 결과가 틀림','ACK와 업무 완료 혼동','독립 verifier와 증거 저장']])}</div><div class="section card"><h2>제품·사업 관점의 지표</h2><p>시연 성공에서 운영 가치로 이어지는 비용을 측정합니다. 하드웨어 감가·준비·설치·정비·지원·실패 비용을 함께 봅니다.</p><pre>성공 업무당 비용 ≈ (운용 + 사람 개입 + 재작업 + 에너지 + 유지 비용) / 검증된 성공 수
관측된 MTTR = 복구 소요시간 합 / 완료된 복구 사건 수
※ 고정비·설치비·장비 수명·수요와 용량은 별도 사업 모델에서 포함</pre><p class="small muted">ROI나 상장 가능성을 계산하는 보장 모델은 아닙니다. 관측한 업무 효용과 확대 시 원가 구조를 구분하세요.</p></div>`;}
function updateCalcs(){const v=id=>Number($('#'+id)?.value);if($('#storageResult')){const values=['camW','camH','camFps','camCount','hours'].map(v);if(values.some(x=>!Number.isFinite(x)||x<=0)){$('#storageResult').textContent='양수 값을 입력하세요.';}else{const rate=v('camW')*v('camH')*5*v('camFps')*v('camCount'),bytes=rate*v('hours')*3600;$('#storageResult').innerHTML=`<strong>${(bytes/1e9).toFixed(1)} GB</strong><p>원시 입력 ${(rate/1e6).toFixed(1)} MB/s · RGB 3 B + depth 2 B / pixel · decimal 단위<br><span class="small muted">압축·중복 저장·기록 overhead가 없는 계산값입니다.</span></p>`;}}if($('#wilsonResult')){const n=v('trials'),x=v('successes');if(!Number.isInteger(n)||!Number.isInteger(x)||n<1||x<0||x>n){$('#wilsonResult').textContent='정수 조건 0 ≤ x ≤ n, n ≥ 1을 확인하세요.';}else{const z=1.96,p=x/n,d=1+z*z/n,c=(p+z*z/(2*n))/d,h=z*Math.sqrt(p*(1-p)/n+z*z/(4*n*n))/d;$('#wilsonResult').innerHTML=`<strong>${(p*100).toFixed(1)}%</strong><p>95% 구간 ${(Math.max(0,c-h)*100).toFixed(1)}–${(Math.min(1,c+h)*100).toFixed(1)}%<br><span class="small muted">입력 ${x}/${n}에 대한 계산값 · 측정 성과 아님</span></p>`;}const dt=v('skew')/1000,t=v('velocity')*dt,r=v('omega')*v('lever')*dt;if([dt,t,r].some(x=>!Number.isFinite(x)||x<0))$('#errorResult').textContent='유효한 0 이상 값을 입력하세요.';else $('#errorResult').innerHTML=`<strong>${((t+r)*1000).toFixed(1)} mm</strong><p>병진 ${(t*1000).toFixed(1)} mm + 회전 기여 근사 ${(r*1000).toFixed(1)} mm<br><span class="small muted">시간 스큐로 인한 기여만 계산. 전체 손끝 오차 아님.</span></p>`;}}

function fieldPipeline(){const r=FP(state.recipe);const tabs=[['process','가공 절차'],['ai','AI와 기존 계산'],['robot','로봇에 전달'],['qc','검증·실패']];let body='';if(state.recipeTab==='process')body=`<div class="card"><h2>${r.title}</h2><div class="grid2"><div><span class="badge">INPUT</span><p style="margin-top:10px">${r.input}</p></div><div><span class="badge blue">OUTPUT</span><p style="margin-top:10px">${r.output}</p></div></div><h3 style="margin-top:24px">실무 처리 순서</h3>${steps(r.steps)}</div>`;if(state.recipeTab==='ai')body=`<div class="card"><h2>AI를 어디에 넣을까?</h2><p class="lead">${r.ai}</p><div class="callout"><p>모델의 의미 추정, 센서의 물리 측정, 기하 변환·최적화, 실행 제어는 다른 역할입니다. 각 출력에 <code>observed / estimated / designed / generated</code>를 구분해 남깁니다.</p></div><h3>연결할 자료</h3>${fieldRefs(r.refs)}<button class="btn ghost" data-page="tools" style="margin-top:20px">입력·출력·컴퓨팅까지 스택 비교</button></div>`;if(state.recipeTab==='robot')body=`<div class="card"><h2>직접적인 로봇 데이터로 연결</h2><p class="lead">${r.robot}</p><h3>산출물의 계약</h3><pre>${esc(JSON.stringify(recipeContract(r),null,2))}</pre><button class="btn primary" data-field-download="recipe">이 변환의 계약 JSON</button><h3 style="margin-top:24px">다음 단계</h3>${flow(['geometry/semantic/measurement','ID·frame·시각·오차','task precondition','verified skill','local feedback','result evidence'])}</div>`;if(state.recipeTab==='qc')body=`<div class="card"><h2>통과를 판정할 측정</h2>${bullets(r.qc)}<div class="callout warn"><strong>가장 흔한 연결 착오</strong><p>${r.missing}</p></div><p class="muted small">허용값은 목표 작업의 공차·안전 여유·장비 조건에서 정합니다. 같은 센서·같은 데이터로 정합과 검증을 동시에 끝내지 말고 독립 checkpoint·현장 관측을 사용합니다.</p><button class="btn ghost" data-page="evaluation">기존 평가·계산 도구 열기</button></div>`;return hero('PROCESSING RECIPES','원천 데이터가 행동 정보가 되는 과정','레시피마다 입력·AI의 역할·결정론적 처리·출력 계약·품질 검사를 구분했습니다. 아래 탐색은 문서이며 모델 추론이나 장비 제어를 실행하지 않습니다.')+`<div class="process-steps"><nav class="process-nav" aria-label="데이터 가공 레시피">${F.recipes.map((x,i)=>`<button data-recipe-select="${x.id}" class="${state.recipe===x.id?'active':''}" aria-pressed="${state.recipe===x.id}">${String(i+1).padStart(2,'0')} · ${x.title}<small>${x.output.slice(0,42)}…</small></button>`).join('')}</nav><section><div class="tabs subtabs" aria-label="레시피 상세">${tabs.map(([id,t])=>`<button data-recipe-tab="${id}" class="${state.recipeTab===id?'active':''}" aria-pressed="${state.recipeTab===id}">${t}</button>`).join('')}</div>${body}<div class="card"><h3>이 처리의 공식 근거</h3>${fieldRefs(r.refs)}</div></section></div>`;}
function recipeContract(r){return {schema_version:'field-processing-draft-1',recipe_id:r.id,input:r.input,output:r.output,required_metadata:['source_asset_id','source_revision','frame_id','clock_id','measurement_time','calibration_id','unit','validity','uncertainty','evidence_type','processing_revision'],quality_gates:r.qc,consumer:r.robot,field_validated:false,acceptance_thresholds:'SET_FROM_TASK_REQUIREMENTS',evidence_refs:r.refs.map(id=>FS(id).url)};}
function fieldTools(){const list=F.tools.filter(t=>state.fieldType==='전체'||t.refs.some(id=>FS(id)?.kind===state.fieldType));const kinds=[...new Set(F.tools.flatMap(t=>t.refs.map(id=>FS(id).kind)))];return hero('AI & ENGINEERING STACK','가장 좋은 도구는 해결할 결손에 따라 달라집니다','먼저 같은 현장 데이터의 기준선을 만드세요. 모델 유행보다 필요한 입력·출력·지연·오차·컴퓨팅·사용 조건으로 선택합니다.')+`<div class="filter-bar"><label class="small">주요 역할 <select id="fieldToolFilter">${['전체',...kinds].map(k=>`<option ${state.fieldType===k?'selected':''}>${k}</option>`).join('')}</select></label><span class="badge">${list.length} / ${F.tools.length}개 스택</span></div><div class="equipment-grid">${list.map(t=>`<article class="equipment-card"><span class="badge blue">STACK CANDIDATE</span><h3>${t.title}</h3><p>${t.why}</p>${table(['입력','출력'],[[t.input,t.output]])}<details open><summary>현장 적용과 효용 비교</summary><div><p><strong>컴퓨팅·실행환경</strong><br>${t.compute}</p><p><strong>비교할 기준선</strong><br>${t.baseline}</p><p class="muted"><strong>실패·한계</strong><br>${t.limits}</p></div></details>${fieldRefs(t.refs)}</article>`).join('')}</div><div class="card section"><h2>업무 효용으로 후보를 줄이는 순서</h2>${steps(['내 데이터 형식·센서·OS·GPU에서 실제로 로드되는가?','같은 장면·분할·해상도에서 기존 방법보다 무엇이 개선되는가?','model inference만이 아니라 decode→전처리→전송→추론→후처리→로봇 소비까지 p95/p99를 재는가?','오류가 발생하면 어떤 downstream 행동에 영향을 주며 어떻게 감지·복구하는가?','코드·가중치·원천 데이터·asset·서비스 이용 조건과 유지 비용을 충족하는가?'])}</div>`;}

function fieldEquipment(){const list=F.equipment.filter(h=>state.hwType==='전체'||h.kind===state.hwType);return hero('HARDWARE & INTEGRATION','장비 이름보다 데이터와 인터페이스를 먼저','장비 역할별 후보와 선택 기준입니다. 장비·payload·현재 software version을 하나의 구성으로 견적·시험하고, 제조사 사양과 전체 작업 정확도를 구분하세요.')+`<div class="card"><h2>세 가지 시작 구성</h2>${table(['출발 목표','구성 예','먼저 남길 검증 자료'],[['데이터/인식 PoC','기존 카메라/RGB-D·소규모 survey scan·기존 PC/GPU','calibration·표본 QC·metric 오차·모델 기준선. 로봇은 후순위.'],['반복 점검 PoC','적합한 이동 base·LiDAR/깊이·점검 payload·edge·기록·정지/유지 계통','위치·inspection pose·계기/온도 기준·coverage·통신/배터리/문 복구'],['정밀 시공·접촉 PoC','측량 control·정밀 위치/기구·특화 장비 또는 팔·도구·접촉 관측','독립 공차 검측·도구/TCP·하중·작업 범위·힘/정지·결과 검사']])}<p class="small muted" style="margin-top:15px">정확한 예산·구매 수량·부품 호환성은 업무 공차·현장·장비 접근성이 확인되어야 결정할 수 있습니다. 아래를 모두 사야 하는 것은 아닙니다.</p></div><div class="filter-bar"><label class="small">장비 역할 <select id="fieldHardwareFilter">${['전체',...new Set(F.equipment.map(h=>h.kind))].map(k=>`<option ${state.hwType===k?'selected':''}>${k}</option>`).join('')}</select></label><span class="badge">${list.length}개 역할</span></div><div class="equipment-grid">${list.map(equipmentCard).join('')}</div><div class="card section"><h2>센서만큼 중요한 주변 장비</h2>${table(['연결 요소','확인할 것'],[['동기·전송','하드웨어 trigger/PTP 필요성·clock owner·USB 대역폭·Ethernet packet loss·sensor timestamp'],['기록','원본 지속 쓰기 속도·codec·MCAP·전원 중단·시간당 용량·복제'],['장착·보호','외부 보정 유지·진동·가림·무게중심·케이블 간섭·방진/방수·열'],['제어·건강','driver·상태·real-time deadline·watchdog·brake/hold·재시작·하중 유지'],['시설 연계','층·문·lift·충전·교통 graph·출입 권한·operator와 역할 분담']])}</div>`;}
function fieldLatest(){return hero('LATEST TECHNOLOGY / EVIDENCE LEVEL','최신 세대와 현장 성숙도를 따로 봅니다','확인일 기준 공개 자료에서 의미 있는 발전을 골랐습니다. 연구 코드의 존재, reference workflow, 제품 발표, 현장 검증은 서로 다른 단계입니다.')+`<div class="card">${F.latest.map(x=>`<article class="latest-item"><div class="year">${x.when}<div class="evidence-row"><span class="badge orange">${x.state}</span></div></div><div><h2>${x.title}</h2><p>${x.value}</p><pre>${x.chain}</pre><p class="muted">${x.caution}</p>${fieldRefs(x.refs)}</div></article>`).join('')}</div><div class="card section"><h2>지금도 가장 중요한 기반</h2><p>기준점·단위·시각·보정·불확실성·접촉·상태 피드백·결과 검사는 최신 모델에도 필요합니다. 최신 모델의 도입 효과는 geometry·규칙·기존 정책 기준선과 동일한 현장 조건에서 비교해야 합니다.</p><button class="btn ghost" data-page="tools">업무 기준으로 스택 고르기 →</button></div>`;}

function fieldVideos(){const vs=F.videos.filter(v=>state.videoType==='전체'||v.workflow===state.videoType);return hero('VERIFIED VIDEO LINKS','장비가 실제로 쓰이는 장면을 연결했습니다','확인된 YouTube 영상 ID·게시자·제목·썸네일로 연결합니다. 썸네일과 재생에는 인터넷이 필요하며 영상은 새 탭의 원문으로 열립니다.')+`<div class="filter-bar"><label class="small">주제 <select id="fieldVideoFilter">${[['전체','전체'],['scan','스캔·mapping'],['layout','레이아웃·시공'],['drill','천장 타공'],['inspect','설비 점검'],['indoor','실시간 3D·이동'],['manipulate','객체 자세'],['atlas','Atlas 플랫폼']].map(([id,t])=>`<option value="${id}" ${state.videoType===id?'selected':''}>${t}</option>`).join('')}</select></label><span class="badge">${vs.length}개 영상</span></div><div class="video-grid">${vs.map(videoCard).join('')}</div><div class="card section"><h2>영상을 볼 때 함께 확인할 것</h2>${bullets(['어떤 장비·센서·현장 조건과 operator 역할이 있는가?','원천에서 실제 출력까지 어떤 소프트웨어·보정·작업 준비가 들어가는가?','연속 무편집 운용·실패·복구·성공률·원가를 확인할 별도 자료가 있는가?','내 건물·물체·정밀도·API·전원·통신 조건에도 적용 가능한가?'])}<p class="small muted">공식 페이지·영상 메타데이터·제공자 설명을 확인했습니다. 전 구간 시청·독립 성능 측정·현장 방문을 수행한 것은 아닙니다.</p></div>`;}
function fieldSpatial(){const captions={bim:['설계 geometry','계획된 벽·방·문과 asset GUID. 현재 사람·적재·문 상태는 포함하지 않습니다.'],occupancy:['관측 기반 통행 표현','흰 칸은 관측 free, 어두운 곳은 장애물, 회색은 unknown. 점이 없다고 free로 칠하지 않습니다.'],semantic:['의미·자산 graph','room·door·설비를 ID·위치·근거·last_seen으로 연결합니다. ID가 맞아도 접근과 현재 상태를 확인해야 합니다.'],mission:['실행 임무','대상 물체의 중심 대신 로봇 base goal·sensor view pose·접근 경로·검사 조건을 정의합니다.']};const [heading,desc]=captions[state.layer];return hero('SPATIAL REPRESENTATIONS','한 공간을 네 가지 데이터로 보기','아래는 가상의 12×8 m 설명용 도식입니다. 실측 건물·실행 가능한 경로·유효한 로봇 구성은 아닙니다. 표현을 바꾸며 무엇이 추가되는지 비교하세요.')+`<div class="tabs" aria-label="공간 표현 선택">${[['bim','설계 BIM'],['occupancy','점유·자유공간'],['semantic','객체·시설 graph'],['mission','로봇 임무']].map(([id,t])=>`<button data-field-layer="${id}" class="${state.layer===id?'active':''}" aria-pressed="${state.layer===id}">${t}</button>`).join('')}</div><div class="representations"><section class="floor-figure">${floorDiagram()}<div class="field-legend"><span><i class="dot" style="background:#526d91"></i>벽·장애물</span><span><i class="dot" style="background:#d5dfeb"></i>미관측</span><span><i class="dot" style="background:#2766da"></i>객체·임무</span></div><p class="small muted">단위·축·origin·층고·map revision을 원본과 로봇 양쪽에서 고정합니다.</p></section><section class="card"><h2>${heading}</h2><p class="lead">${desc}</p><h3>로봇이 추가로 알아야 하는 것</h3>${bullets(['현재 내 위치와 이 지도의 변환·불확실성','몸 외곽·센서 시야·도달 거리·제동/하중','문·사람·적재 등 최근 변화와 만료 시각','허용 작업·접근 위치·완료 검사·실패 복구'])}<button class="btn primary" data-field-download="task">시설 점검 임무 계약 JSON</button></section></div><div class="card section"><h2>좌표의 전체 연결</h2><pre>survey / project CRS (필요한 경우)
  ↕  측량 control·고도 기준·축/단위·local origin

  ↕  독립 checkpoint로 검증한 registration
robot_map ── robot_odom ── robot_base ── sensor / tool / TCP

Task = asset ID + target frame + map/calibration revision
       + observation freshness + reachability + permission

document.addEventListener('error',e=>{if(e.target?.tagName==='IMG'){e.target.hidden=true;const p=e.target.parentElement;p.querySelector('.media-fallback')?.removeAttribute('hidden');}},true);
function fieldDownload(type){if(type==='grid')return download('field_points_to_grid.py',F.artifacts['field_points_to_grid.py'],'text/x-python');if(type==='ifc')return download('ifc_asset_extract.py',F.artifacts['ifc_asset_extract.py'],'text/x-python');if(type==='points')return download('points.sample.csv','x,y,z\n1,1,0.5\n1.1,1,0.6\n2,2,0.8\n2,2,0.05\n3,1.5,1.2\n','text/csv');if(type==='free')return download('observed_free.sample.csv','x,y\n0.1,0.1\n0.2,0.1\n0.3,0.1\n0.4,0.1\n','text/csv');let name='field-data-plan.json',obj;if(type==='recipe'){name='processing-'+state.recipe+'.json';obj=recipeContract(FP(state.recipe));}else if(type==='task'){name='field-inspection-task.json';obj=fieldTaskContract();}else if(type==='evidence'){name='field-research-evidence.json';obj={checked:F.checked,sources:F.sources,videos:F.videos,scope:'Official docs and metadata research; no hardware benchmark or full-video viewing.'};}else {const w=FW(state.workflow);obj={schema_version:'field-data-plan-draft-1',checked:F.checked,workflow:w,processing:w.recipes.map(FP).map(recipeContract),hardware:w.hardware.map(FH),source_urls:[...new Set(w.refs.concat(...w.recipes.map(id=>FP(id).refs),...w.hardware.map(id=>FH(id).refs)))].map(id=>FS(id).url),field_validated:false,acceptance_thresholds:'DEFINE_WITH_SITE_TEAM',original_guide_sha256:F.original_sha256};}download(name,JSON.stringify(obj,null,2));}
$('#search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();if(!q){render();return;}const search=a=>a.filter(x=>JSON.stringify(x).toLowerCase().includes(q)),mods=search(allSkills()),ws=search(F.workflows),ps=search(F.recipes),ts=search(F.tools),hs=search(F.equipment),vs=search(F.videos);$('#content').innerHTML=hero('FIELD SEARCH','데이터·업무·기술 통합 검색',`“${esc(e.target.value)}” · 업무 ${ws.length} · 가공 ${ps.length} · 기술 ${ts.length} · 장비 ${hs.length} · 모듈 ${mods.length} · 영상 ${vs.length}`)+ws.map(w=>`<button class="search-hit" data-workflow="${w.id}"><span class="badge">업무</span><strong>${w.title}</strong><p class="muted small">${w.goal}</p></button>`).join('')+ps.map(r=>`<button class="search-hit" data-recipe="${r.id}"><span class="badge blue">가공</span><strong>${r.title}</strong><p class="muted small">${r.output}</p></button>`).join('')+hs.map(h=>`<button class="search-hit" data-hardware="${h.id}"><span class="badge">장비</span><strong>${h.title}</strong><p class="muted small">${h.role}</p></button>`).join('')+ts.map(t=>`<div class="card"><h3>${t.title}</h3><p>${t.why}</p>${fieldRefs(t.refs)}</div>`).join('')+mods.map(s=>`<button class="search-hit" data-skill="${s.id}"><span class="badge">기반 모듈</span><strong>${s.title}</strong><p class="muted small">${s.expert.goal}</p></button>`).join('')+(vs.length?'<div class="video-grid">'+vs.map(videoCard).join('')+'</div>':'')+(!mods.length&&!ws.length&&!ps.length&&!ts.length&&!hs.length&&!vs.length?'<p class="empty">다른 데이터명·기술명·실패 증상으로 찾아보세요.</p>':'');});
// Print all field recipes, regardless of which tab happens to be selected.
const originalPreparePrint=preparePrint;
preparePrint=function(){const old={...state};const recipes=F.recipes.map(r=>`<section class="pagebreak"><h1>${r.title}</h1><div class="card"><h3>입력</h3><p>${r.input}</p><h3>출력</h3><p>${r.output}</p><h3>절차</h3>${steps(r.steps)}<h3>AI의 역할</h3><p>${r.ai}</p><h3>로봇 연결</h3><p>${r.robot}</p><h3>검증</h3>${bullets(r.qc)}<p>${r.missing}</p>${fieldRefs(r.refs)}</div></section>`).join('');$('#printContent').innerHTML=hero('FIELD & SPATIAL','현장·공간 로봇 데이터 로드맵',F.checked)+recipes+fieldData()+fieldTools()+fieldEquipment()+fieldLatest()+fieldVideos()+fieldSources();state=old;$('#printContent').querySelectorAll('details').forEach(x=>x.open=true);};
// The existing print listener captured the old function; replace only that listener.
window.removeEventListener('beforeprint',originalPreparePrint);window.addEventListener('beforeprint',()=>preparePrint());

window.addEventListener('hashchange',readHash);readHash();
</script></body></html>
