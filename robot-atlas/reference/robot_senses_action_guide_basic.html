조사 진단 인터페이스, 적재별 소비량·열·통신 장애 시험.", "example": "무거운 물체 이동 전 귀환 여유를 확인 → 부족하면 먼저 충전.", "learn": "초기에는 장비 규칙·진단 활용. 운영 로그가 쌓이면 잔여 수명·소비 예측 개선.", "refs": [3, 4]}]}], "sources": [{"id": 0, "title": "ROS 2 tf2 · 좌표와 시각 연결", "url": "https://github.com/ros2/ros2_documentation/blob/rolling/source/ROS-Framework/interfaces/About-Tf2/About-Tf2.rst", "note": "카메라·몸·손 기준의 좌표 변환"}, {"id": 1, "title": "MoveIt · 로봇 운동 계획 개념", "url": "https://moveit.ai/documentation/concepts/", "note": "운동학·충돌 모델·관절 한계"}, {"id": 2, "title": "MoveIt Servo · 움직임의 연속 수정", "url": "https://moveit.picknik.ai/main/doc/examples/realtime_servo/realtime_servo_tutorial.html", "note": "특이점·충돌·속도 제한"}, {"id": 3, "title": "ros2_control · 제어 관리자", "url": "https://control.ros.org/jazzy/doc/ros2_control/controller_manager/doc/userdoc.html", "note": "상태 읽기 → 제어 계산 → 명령 쓰기"}, {"id": 4, "title": "Franka · 실시간 제어 인터페이스", "url": "https://frankarobotics.github.io/docs/doc/libfranka/docs/overview.html", "note": "특정 로봇의 1 kHz 제어와 상태 피드백 사례"}, {"id": 5, "title": "Nav2 · 환경 표현", "url": "https://docs.nav2.org/jazzy/getting_started/navigation_concepts/environmental_representation/", "note": "이동 경로에 쓰는 장애물·비용 지도"}, {"id": 6, "title": "Nav2 · 충돌 감시", "url": "https://docs.nav2.org/rolling/configuration_and_development/configuration_guide/core_servers/collision_monitor/configuring_collision_monitor_node/", "note": "센서 기반 정지·감속; 인증된 안전 장치의 대체가 아님"}, {"id": 7, "title": "robot_localization · 센서 준비", "url": "https://github.com/cra-ros-pkg/robot_localization/blob/rolling-devel/doc/preparing_sensor_data.rst", "note": "좌표·단위·IMU·오도메트리 정리"}, {"id": 8, "title": "robot_localization · 센서 융합 설정", "url": "https://github.com/cra-ros-pkg/robot_localization/blob/rolling-devel/doc/configuring_robot_localization.rst", "note": "여러 센서의 오차를 고려한 상태 추정"}, {"id": 9, "title": "RealSense · 깊이 품질 시험", "url": "https://www.realsenseai.com/wp-content/uploads/2019/11/RealSense_DepthQualityTesting.pdf", "note": "거리 측정의 현장 품질 확인과 반사면 문제"}, {"id": 10, "title": "GelS function skillDetail(s,p,print=false){return `<div class="card"><span class="tag">${p.name}</span><span class="tag">${s.title}</span><h2>${s.title}</h2><div class="callout"><strong>쉽게 생각하면</strong><p>${s.child}</p></div><h3>① 어떤 정보가 필요할까?</h3><div class="table-wrap"><table><thead><tr><th>들어오는 데이터</th><th>모양·단위</th><th>어디에 쓸까?</th></tr></thead><tbody>${s.rows.map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div><h3 style="margin-top:22px">② 감각이 행동이 되는 연결</h3><div class="flow"><span class="node">센서로 측정</span><i>→</i><span class="node">값 정리·상태 추정</span><i>→</i><span class="node">판단</span><i>→</i><span class="node">명령</span><i>↻</i><span class="node">다시 측정</span></div><p><strong>가공·필수 기술</strong><br>${s.process}</p><p><strong>판단 규칙</strong><br>${s.decision}</p><p><strong>나가는 명령·정보</strong><br>${s.action}</p><p><strong>행동 후 확인</strong><br>${s.feedback}</p><div class="callout warn"><strong>이것만으로 부족한 이유</strong><p>${s.missing}</p></div><h3>③ 실제 현장의 예</h3><p>${s.example}</p><${print?'div':'details'}${print?'':' open'}><${print?'h4':'summary'}>④ 구현할 때 준비할 것 · 학습은 꼭 필요할까?</${print?'h4':'summary'}><div><p><strong>보정·준비</strong><br>${s.prepare}</p><p><strong>학습 데이터와 구현 선택</strong><br>${s.learn}</p></div></${print?'div':'details'}><details${print?' open':''}><summary>근거 자료 확인</summary><div class="small">${links(s.refs)}<p class="muted">출처는 연결된 기술의 근거입니다. 현장 예·설계 절차는 이를 바탕으로 구성한 교육용 설명이며 특정 제품의 성능 보장이 아닙니다.</p></div></details></div>`;}

function bodyPage(){const p=partBy(state.part)||DATA.parts[0],s=p.skills.find(s=>s.id===state.skill);return title('01 / BODY ATLAS','로봇은 어떻게 느끼고 움직일까?','몸의 부위를 고르면 감각·행동이 나오고, 한 번 더 고르면 필요한 데이터와 기술이 펼쳐집니다. 사람의 몸은 이해를 돕는 비유입니다. 로봇이 감정을 느낀다는 뜻은 아닙니다.')+`<div class="body-grid"><section class="robot-panel" aria-label="몸 부위 선택">${robot()}<p class="part-title">몸의 역할 선택</p><div class="part-links">${DATA.parts.map(p=>`<button type="button" data-part="${p.id}" class="${state.part===p.id?'active':''}" aria-pressed="${state.part===p.id}">${p.name.split(' · ')[0]} · ${p.short}</button>`).join('')}</div><p class="muted small" style="margin-top:14px">${DATA.parts.length}개 몸의 역할 · ${DATA.parts.reduce((n,p)=>n+p.skills.length,0)}개 감각·행동<br>모든 로봇에 모든 부위가 필요한 것은 아닙니다.</p></section><section><div class="crumb"><button data-part="${p.id}">몸의 역할</button> › ${p.name}${s?' › '+s.title:''}</div>${s?`<button class="btn" data-part="${p.id}" style="margin-bottom:15px">← ${p.short} 목록</button>`+skillDetail(s,p):`<div class="card"><span class="tag">${p.short}</span><h2>${p.name}</h2><p>${p.role}</p><p class="small muted">궁금한 감각·행동을 선택하세요.</p></div><div class="skill-list">${p.skills.map(s=>`<button class="skill-button" data-skill="${s.id}"><strong>${s.title} <span aria-hidden="true">↗</span></strong><span>${s.child}</span></button>`).join('')}</div><div class="callout" style="margin-top:20px"><strong>연결해서 보면 더 쉬워요</strong><p>물체 찾기 → 거리 재기 → 좌표 맞추기 → 팔 뻗기 → 잡기 → 다시 확인.</p><button class="btn" data-page="tasks">컵 집기 순서 따라가기 →</button></div>`}</section></div>`;}

function tasksPage(){const t=TASKS[state.task],st=t.steps[state.step],s=findSkill(st[2]);return title('02 / ACTION CHAIN','행동 하나에 여러 감각이 모입니다','왼쪽 단계를 고르면 그 순간 쓰는 정보와 판단을 볼 수 있습니다. “명령 → 움직임” 사이의 연결을 따라가세요.')+`<div class="tabs" aria-label="행동 예시">${TASKS.map((t,i)=>`<button data-task="${i}" class="${state.task===i?'active':''}" aria-pressed="${state.task===i}">${t.title}</button>`).join('')}</div><div class="callout"><strong>${t.title}</strong><p>${t.goal}</p></div><div class="steps-layout"><section class="step-list" aria-label="행동 단계">${t.steps.map((st,i)=>`<button class="step ${state.step===i?'active':''}" data-step="${i}" aria-pressed="${state.step===i}"><span class="step-number">${i+1}</span><span><strong>${st[0]}</strong><small>${st[1]}</small></span></button>`).join('')}</section><section><div class="card"><span class="tag">${state.step+1} / ${t.steps.length} 단계</span><h2>${st[0]}</h2><p>${s.child}</p><h3>필요한 정보</h3><p>${st[3]}</p><h3>확인하고 다음으로</h3><p>${st[4]}</p><div class="flow"><span class="node">측정</span><i>→</i><span class="node">${s.title}</span><i>→</i><span class="node">결과 확인</span><i>↻</i><span class="node">필요하면 수정</span></div><button class="btn primary" data-skill="${s.id}">이 단계의 데이터·기술 자세히 →</button></div><div class="two"><button class="btn" data-step="${Math.max(0,state.step-1)}" ${state.step===0?'disabled':''}>← 이전 단계</button><button class="btn" data-step="${Math.min(t.steps.length-1,state.step+1)}" ${state.step===t.steps.length-1?'disabled':''}>다음 단계 →</button></div></section></div>`;}
function foundationPage(){return title('03 / DATA FOUNDATIONS','데이터를 모으는 것보다 연결이 먼저','눈은 컵을 맞게 봤는데 손은 엉뚱한 곳으로 갈 수 있습니다. 센서 값의 단위·시간·좌표·오차가 맞아야 같은 현실을 말할 수 있습니다.')+`<div class="flow">${[['recognize','무엇?'],['depth','어디?'],['frames','어느 기준?'],['sync','언제?'],['reach','닿을까?'],['grip','잡혔나?'],['executive','끝났나?']].map(([id,l],i)=>`${i?'<i>→</i>':''}<button data-skill="${id}">${l}</button>`).join('')}</div><div class="card"><h2>네 종류의 데이터를 구분해요</h2><table><tr><th>종류</th><th>역할과 예</th><th>확보 방법</th></tr><tr><td>몸의 설계·보정</td><td>팔 길이, 관절 축, 카메라 위치, 도구 끝, 힘 영점</td><td>제조사 모델 + 실측 보정</td></tr><tr><td>지금 들어오는 감각</td><td>영상, 거리, 관절, 힘, 접촉, 배터리</td><td>현장 센서와 장비 API</td></tr><tr><td>목표와 작업 규칙</td><td>무엇을 옮기는지, 어디까지 허용하는지, 완료 검사</td><td>사용자·현장 절차·작업 설계</td></tr><tr><td>배우고 평가할 경험</td><td>관측-행동 짝, 성공·실패·사람 개입·복구</td><td>시연·운용 기록·표적 시험</td></tr></table><div class="callout"><strong>AI 학습 없이도 가능한 부분이 많아요.</strong><p>거리 측정, 좌표 변환, 운동학, 경로 계획, PID 제어, 상태 기계는 모델·계산·규칙으로 구현할 수 있습니다. 학습은 인식·복잡한 조작 등 부족한 부분에 선택해서 더합니다.</p></div></div><div class="two"><div class="card"><h3>1. 단위와 기준</h3><p>30 mm와 30 m는 천 배 다릅니다. 카메라 앞쪽과 로봇 앞쪽도 다를 수 있습니다.</p><p><strong>내부 보정:</strong> 렌즈 초점·왜곡.<br><strong>외부 보정:</strong> 카메라와 몸의 위치 관계.<br><strong>도구 보정:</strong> 플랜지에서 실제 손끝까지.</p><button class="btn" data-skill="frames">좌표 연결 보기</button></div><div class="card"><h3>2. 측정한 시간</h3><p>움직이는 로봇은 오래된 사진으로 지금 손 위치를 정할 수 없습니다. 측정 시각·전송 지연·누락을 구분합니다.</p><p>예: 0.5 m/s × 0.2 s 지연 = 약 10 cm 이동. 단순 설명이며 회전·가속은 생략했습니다.</p><button class="btn" data-skill="sync">시간과 융합 보기</button></div></div><div class="card"><h2>“센서를 다 달면 충분할까?”</h2><p>필요충분한 센서 목록은 모든 로봇에 공통으로 정할 수 없습니다. 먼저 <strong>작업·재질·정밀도·환경·속도·실패 비용</strong>을 정하고, 필요한 정보를 어떤 방식으로 얻을지 고릅니다.</p><table><tr><th>목표</th><th>우선 필요한 정보</th><th>가능한 구성 예 / 추가 조건</th></tr><tr><td>고정 위치의 단단한 블록 이동</td><td>대상 위치·관절·그리퍼 상태·완료 확인</td><td>정밀 지그가 위치를 고정하면 카메라를 생략할 수도 있음. 초기 장비·정지 계통 검증 필요.</td></tr><tr><td>흩어진 다양한 물체 집기</td><td>대상·3D 자세·접근 여유·파지·미끄러짐</td><td>RGB-D + 관절 + 그리퍼. 촉각/힘 또는 검증된 대체 관측을 작업별로 추가.</td></tr><tr><td>정밀 끼워 맞추기</td><td>정렬·공차·접촉 방향·힘·삽입 결과</td><td>보정된 비전 + 정밀 기구 + 힘 제어/컴플라이언스. 요구 공차로 실측 검증.</td></tr><tr><td>사람이 있는 실내 이동</td><td>위치·동적 장애물·몸 크기·정지거리</td><td>LiDAR/깊이 + 위치 추정 + 장비별 안전 계통. 사각과 실제 제동 시험.</td></tr></table></div><div class="card"><h2>기록 예시: 데이터에 꼬리표 붙이기</h2><pre>{

}</pre><p class="small muted">교육용 구조입니다. ROS 메시지 그대로는 아니며, 모든 수치를 실제 측정으로 채워야 합니다.</p></div>`;}
function labPage(){return title('04 / FEEDBACK LAB','값을 바꾸면 판단도 바뀝니다','원리를 이해하는 계산 실험입니다. 실제 센서·로봇·물리 시뮬레이터와 연결되지 않으며, 여기의 수치를 장비 설정값으로 사용하지 않습니다.')+`<div class="lab-grid"><section class="card"><h2>실험 A · 오래된 눈과 거리 여유</h2><p>팔이 가까워질 때, 측정이 늦으면 그 사이에 더 움직입니다.</p>${slider('gap','측정된 간격','cm',2,60,30,1)}${slider('speed','접근 속도','cm/s',0,100,30,1)}${slider('delay','감각·통신 지연','ms',0,500,200,10)}${slider('error','위치 오차 여유','cm',0,15,3,1)}<div id="distanceResult" aria-live="polite"></div><p class="small muted">계산: 남는 여유 = 간격 − 속도×지연 − 위치 오차 여유。일정 속도만 가정하며 가속·제동거리·물체 움직임·기구 변형을 생략했습니다. 실제 안전 판단식이 아닙니다.</p><button class="btn" data-skill="sync">관련 데이터 보기 →</button></section><section class="card"><h2>실험 B · 약하면 미끄럽고 세면 눌려요</h2><p>서로 마주 보는 두 손가락이 수직 물체를 똑같이 누른다고 가정합니다.</p>${slider('mass','물체 질량','g',50,1000,300,10)}${slider('friction','가정한 마찰계수','',0.1,1,0.4,0.05)}${slider('force','한 손가락의 누르는 힘','N',0,30,5,0.5)}${slider('limit','한 손가락의 가정한 허용 힘','N',2,30,12,1)}<div id="gripResult" aria-live="polite"></div><p class="small muted">단순 정지 마찰식: 위로 버티는 힘 ≈ 2×마찰계수×한쪽 누르는 힘。무게 ≈ 질량(kg)×9.81。가속·회전·접촉 형상·압력 분포를 생략했습니다. 허용 힘은 가상 입력이며 실제 물체 시험으로 정해야 합니다.</p><button class="btn" data-skill="slip">미끄러짐 복구 보기 →</button></section></div>`;}
function slider(id,label,unit,min,max,val,step){return `<div class="control"><label for="${id}">${label}<strong id="${id}Val">${val} ${unit}</strong></label><input id="${id}" data-unit="${unit}" type="range" min="${min}" max="${max}" value="${val}" step="${step}"></div>`;}
function updateLab(){if(!$('#gap'))return;document.querySelectorAll('input[type=range]').forEach(x=>$('#'+x.id+'Val').textContent=x.value+' '+x.dataset.unit);const v=id=>Number($('#'+id).value),travel=v('speed')*v('delay')/1000,room=v('gap')-travel-v('error');$('#distanceResult').innerHTML=`<div class="result ${room<=0?'bad':''}">계산상 여유 ${room.toFixed(1)} cm</div><div class="meter"><span style="width:${Math.min(100,Math.max(0,room/v('gap')*100))}%"></span></div><p>늦게 보는 동안 이동: <strong>${travel.toFixed(1)} cm</strong></p><div class="log">${room<=0?'이 단순 계산에서는 여유가 사라졌어요. 늦은 값으로 계속 접근하면 안 돼요.':'단순 계산상 여유가 남아요. 실제 움직임에는 제동거리 등 빠진 조건도 확인해야 해요.'}</div>`;const weight=v('mass')/1000*9.81,hold=2*v('friction')*v('force'),min=weight/(2*v('friction')),crush=v('force')>v('limit'),slip=hold<=weight;$('#gripResult').innerHTML=`<div class="result ${crush||slip?'bad':''}">${crush?'가정한 눌림 한계 초과':slip?'지지력이 부족하거나 여유 없음':'단순 모델상 정지 지지 가능'}</div><p>무게 ${weight.toFixed(2)} N / 지지 가능 힘 ${hold.toFixed(2)} N<br>필요한 한쪽 힘: ${min.toFixed(2)} N 초과</p><div class="log">${min>=v('limit')?'이 조건에서는 버틸 힘과 허용 힘 범위가 겹치지 않아요. 다른 손끝·받침·잡는 방법이 필요해요.':crush?'물체가 손상될 수 있어요. 힘·접촉 면적·잡는 방법을 다시 살펴요.':slip?'촉각·상대 이동을 보고 허용 범위 안에서 힘이나 잡기를 바꿔요.':'실제 안정 여부는 미끄러짐·변형·움직임을 다시 관측해야 해요.'}</div>`;}
function brainPage(){return title('05 / ROBOT BRAIN','채팅 AI가 로봇의 뇌가 될 수 있을까?','네. 목표 해석과 계획을 맡기는 구조는 가능합니다. 실제 감각을 읽는 프로그램, 검증된 작업 기술, 빠른 제어와 실행 감시를 함께 연결해야 합니다.')+`<div class="card"><h2>생각의 속도와 반사의 속도를 나눕니다</h2><table><tr><th>역할</th><th>무엇을 하나?</th><th>필요한 입력</th></tr><tr><td>대화·목표 해석 · LLM/VLM</td><td>“어떤 컵을 어디로?” 질문·작업 계획·도구 선택</td><td>명령·권한·최신 현장 요약·기술 목록</td></tr><tr><td>작업 감독 · 상태 기계/행동 트리</td><td>전제 검사·순서·취소·시간 제한·재시도</td><td>센서 상태·도구 결과·완료 검사</td></tr><tr><td>운동 계획 / 행동 정책</td><td>충돌 없는 경로·잡기·짧은 동작 생성</td><td>3D 목표·현재 몸·지도·관절 한계</td></tr><tr><td>빠른 제어 · 로컬 컨트롤러</td><td>실제 관절·힘 오차를 계속 줄임</td><td>관절·속도·힘·명령·제어 모델</td></tr><tr><td>독립 감시·장비 안전</td><td>금지 조건·센서 만료·통신 이상·비상 정지</td><td>검증된 한계·진단·실제 위험 신호</td></tr></table><p style="margin-top:15px">일부 Franka 인터페이스는 <strong>1 kHz, 즉 1초에 1,000번</strong> 상태를 주고받으며 제어합니다. 이 수치는 해당 장비 사례이며 모든 로봇의 기준은 아닙니다. 클라우드 대화 응답을 기다리는 동안에도 로컬 제어와 감시는 동작해야 합니다. <a href="${DATA.sources[4].url}" target="_blank" rel="noopener">[5] 실제 제어 문서</a></p></div><div class="flow"><span class="node">사용자 채팅</span><i>→</i><span class="node">목표·대상 확인</span><i>→</i><span class="node">도구 호출 검사</span><i>→</i><span class="node">작업 기술</span><i>→</i><span class="node">빠른 제어</span><i>↻</i><span class="node">센서·완료 검사</span></div><div class="card"><h2>능동적으로 일하는 데 필요한 것</h2><ol><li><strong>지속되는 목표:</strong> 완료 조건·우선순위·자원·종료 시점.</li><li><strong>현재 세계 상태:</strong> 물체 ID·위치·시각·오차·센서 건강·장비 상태.</li><li><strong>실행 가능한 기술:</strong> 탐색·접근·집기·놓기 등의 명확한 입출력과 전제.</li><li><strong>피드백:</strong> 성공·실패·접촉·완료를 독립 관측으로 확인.</li><li><strong>감독과 복구:</strong> 시간 초과·취소·재관측·재시도 제한·사람 호출.</li><li><strong>기억:</strong> 현재 작업 상태와 필요한 경험. 저장한다고 즉시 모델이 학습되는 것은 아님.</li></ol><div class="callout"><p>능동성은 “아무 목표나 스스로 만들어 계속 움직임”이 아니라, 맡은 목표 안에서 변화 감지 → 필요한 관측 → 판단 → 실행 → 확인을 이어가는 것으로 설계할 수 있습니다.</p></div></div><div class="card"><h2>도구 연결을 눈으로 확인해요</h2><p class="small muted">아래는 정해진 단어와 시나리오로만 반응하는 로컬 교육 예시입니다. 실제 LLM 호출·자유로운 자연어 이해·로봇 제어는 하지 않습니다.</p><form id="demoForm"><label for="chat">예시 지시</label><div class="row"><input class="search" id="chat" value="빨간 컵을 상자에 넣어줘" style="flex:1" autocomplete="off"><button class="btn primary">연결 순서 보기</button></div><label class="small" for="demoCase">현장 상태를 바꿔보기</label><select id="demoCase" class="search"><option value="ok">컵 하나 · 센서 정상</option><option value="ambiguous">빨간 컵 두 개</option><option value="stale">거리 센서값이 오래됨</option><option value="slip">잡은 뒤 미끄러짐</option><option value="offline">클라우드 연결 끊김</option></select></form><div id="demoResult" aria-live="polite"></div></div><div class="card"><h2>실제 연결에서는 이런 약속이 필요합니다</h2><pre>{
  "tool": "pick_and_place",
  "arguments": {"object_id": "cup_A", "destination_id": "box_B"},
  "requires": ["fresh_pose", "valid_calibration", "robot_ready"],
  "runtime_checks": ["collision", "force", "sensor_age", "timeout"],
  "verify": "object_stably_inside_box",
  "on_failure": "return_observed_error_and_request_replan"
}</pre><p>구현 방향을 설명하는 의사 형식입니다. 호출 형식을 맞춰도 실행 안전성과 성공이 자동 보장되지는 않습니다. 실제 코드가 전제·권한·동작 한계·상태 변화를 검사해야 합니다.</p><h3>LLM · VLM · VLA</h3><p><strong>LLM:</strong> 언어를 다루는 모델. 텍스트로 요약한 센서 상태를 도구를 통해 받을 수 있습니다.<br><strong>VLM:</strong> 영상과 언어를 함께 이해하는 모델. 픽셀을 정확한 거리로 바꾸려면 보정·측정 연결이 필요합니다.<br><strong>VLA:</strong> 영상·언어 등 관측에서 행동 표현을 출력하는 모델. 로봇 몸·행동 단위·센서·제어 조건을 맞춰야 합니다.</p><p class="small">연구 근거: ${links([11,12,13])}</p></div>`;}
function demo(){const t=$('#chat').value.trim(),c=$('#demoCase').value;let items=[];if(!t)items=['지시를 입력해 주세요.'];else if(/멈|중지/.test(t))items=['중지 요청을 작업 감독으로 전달하는 예시입니다.','로컬 제어가 정지 상태를 확인합니다. 실제 비상 정지는 독립 장치로 설계합니다.'];else if(!/컵/.test(t)||!/상자/.test(t))items=['이 예시는 “컵”과 “상자”가 있는 집기 지시만 보여줍니다.','실제 LLM이라면 목표를 해석하되, 구현된 기술과 현재 장비로 가능한지 따로 검사해야 합니다.'];else if(c==='ambiguous')items=['대상 확인: 빨간 컵 두 개가 관측됨.','사용자에게 “왼쪽과 오른쪽 중 어느 컵인가요?” 질문.','대상이 정해질 때까지 이동 명령을 만들지 않음.'];else if(c==='stale')items=['pick_and_place(cup_A, box_B) 후보 생성.','실행 전 검사: 거리 관측이 오래되어 전제 불충족.','재관측 요청 → 새로운 좌표·오차를 받은 뒤 다시 검사.'];else if(c==='offline')items=['클라우드 대화 연결을 사용할 수 없음.','로컬 감독이 사전 정의한 중단·유지·완료 가능 범위를 적용.','장비 상태와 하중을 고려한 정지·유지 동작을 로컬에서 확인.'];else{items=['목표: cup_A를 box_B 안에 안정적으로 놓기.','관측·권한·보정·센서 신선도·장비 상태 검사.','경로 계획 → 로컬 제어로 접근 → 그리퍼 접촉 확인.'];if(c==='slip')items.push('촉각/상대 이동에서 미끄러짐 감지.','허용 힘 안에서 조정하거나 내려놓기 → 재관측 → 제한된 재시도.');else items.push('힘과 물체 상태를 다시 읽으며 이동·놓기.');items.push('상자 안 물체 위치와 안정 상태를 별도 관측해 완료 확인.');}$('#demoResult').innerHTML=`<div class="log"><strong>교육용 처리 순서</strong><ol>${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`;}
function buildPage(){return title('06 / BUILD PATH','원하는 행동을 현실에서 만드는 순서','처음 목표는 “무엇이든 하는 로봇”보다, 조건이 명확한 행동 하나를 반복해서 성공시키는 것입니다.')+`<div class="card"><h2>첫 실험의 범위를 적습니다</h2><p>예: 고정된 테이블 위의 불투명한 블록을 알려진 상자에 옮긴다. 사람 없는 시험 구역, 정해진 물체·속도·적재, 정지 절차, 독립적인 결과 확인을 포함합니다.</p><table><tr><th>순서</th><th>할 일</th><th>반드시 남길 자료</th></tr><tr><td>1 · 행동 정의</td><td>물체·환경·완료·실패·허용 오차·시간 정하기</td><td>작업 명세·검사 기준</td></tr><tr><td>2 · 몸과 도구 선택</td><td>도달 거리·하중·개도·정밀도·인터페이스 확인</td><td>기구 모델·제조사 제한·제어 지원</td></tr><tr><td>3 · 센서·보정</td><td>필요한 정보를 선택해 단위·시각·좌표 연결</td><td>카메라·TCP·힘 영점·오차 시험</td></tr><tr><td>4 · 기본 동작</td><td>사람이 지정한 목표로 접근·집기·놓기 구현</td><td>실제 위치·힘·실패·정지 결과</td></tr><tr><td>5 · 인식 연결</td><td>물체 ID·자세를 실행 가능한 목표로 변환</td><td>현장 조명·가림·배치별 평가</td></tr><tr><td>6 · 피드백·복구</td><td>미끄러짐·센서 누락·잡기 실패·시간 초과 대응</td><td>개입 원인·복구·재시도 이력</td></tr><tr><td>7 · 채팅 감독</td><td>도구 호출·확인 질문·완료 검사 연결</td><td>스키마·권한·기술별 전제와 결과</td></tr><tr><td>8 · 필요 부분만 학습</td><td>규칙·보정·기구 변경으로 부족한 지점 수집</td><td>관측-행동 짝·정답·분리 평가셋</td></tr></table></div><div class="two"><div class="card"><h3>기본 소프트웨어 구성 예</h3><ul><li>ROS 2: 장치와 데이터 통신</li><li>tf2: 좌표·시간 변환</li><li>MoveIt: 팔 경로·운동학</li><li>ros2_control / 제조사 제어기: 장비 상태와 제어</li><li>Nav2 + 위치 추정: 이동 로봇에 해당</li><li>상태 기계 / 행동 트리: 작업 감독</li><li>LLM 도구 호출: 지시 해석과 계획 보조</li></ul><p class="small muted">가능한 조합의 예입니다. 필수 구매 목록이 아니며 장비·드라이버·OS·버전 호환성을 확인해야 합니다.</p></div><div class="card"><h3>실제 성능은 이렇게 확인해요</h3><ul><li>다른 날짜·배치·물체에서도 성공하는가?</li><li>목표 위치 오차와 실제 접촉력은 얼마인가?</li><li>손상·낙하·사람 개입은 몇 번인가?</li><li>센서가 가려지거나 끊기면 어떻게 되는가?</li><li>작업·복구·준비 시간까지 경제적인가?</li><li>성공 판정이 실제 결과와 일치하는가?</li></ul><p class="small muted">센서 하나의 오차와 로봇 손끝 전체 오차는 다릅니다. 보정·구동·지연·접촉 오차가 합쳐집니다.</p></div></div><div class="card"><h2>기록부터 학습까지</h2><div class="flow"><span class="node">시연·운용</span><i>→</i><span class="node">원본 보존</span><i>→</i><span class="node">시간·좌표 정렬</span><i>→</i><span class="node">성공·실패·복구 라벨</span><i>→</i><span class="node">목적별 학습</span><i>→</i><span class="node">별도 실전 평가</span></div><p>인터넷 영상은 물체·행동 이해에 도움이 됩니다. 실제 명령·힘·관절 상태가 없는 영상만으로 현장의 정밀 접촉 제어를 완성하기는 어렵습니다. 필요한 결손을 먼저 정한 뒤 실측과 시연을 수집하세요.</p><button class="btn" data-skill="logs">수집·가공 데이터 자세히 →</button></div>`;}
const glossary=[['센서','세상의 변화를 숫자로 읽는 장치.'],['엔코더','관절·바퀴의 돌아간 양을 재는 장치.'],['자기수용감각','내 몸의 관절·힘·움직임 상태를 아는 감각.'],['자세 Pose','위치와 방향을 합친 정보.'],['좌표계','위치를 말할 때 쓰는 기준점과 축.'],['보정 Calibration','측정 오차나 장치 사이 관계를 기준값과 맞추는 일.'],['TCP','도구의 실제 작업 기준점. 도구를 바꾸면 다시 확인.'],['순운동학 FK','관절 각도로 손끝 위치를 계산.'],['역운동학 IK','원하는 손끝 자세에 맞는 관절 각도를 계산.'],['궤적','시간에 따라 어디를 어떤 속도로 지날지 정한 계획.'],['피드백·폐루프','한 번 명령하고 끝내지 않고 실제 결과를 다시 읽어 수정.'],['임피던스 제어','몸이 가상의 스프링·댐퍼처럼 반응하도록 조절.'],['어드미턴스 제어','받은 힘에 따라 목표 움직임을 바꾸는 방식.'],['SLAM','이동하며 지도와 내 위치를 함께 추정.'],['오도메트리','바퀴·영상 등에서 최근 이동량을 추정. 시간이 지나면 오차 누적.'],['센서 융합','각 센서의 오차와 특성을 고려해 상태를 함께 추정.'],['공분산','추정 오차의 크기와 축 사이 관계를 나타내는 수학적 값.'],['Hz','1초에 반복하는 횟수. 100 Hz는 초당 100번.'],['토크','물체나 관절을 돌리려는 힘의 효과. 단위 N·m.'],['특이점','특정 방향의 손 움직임을 만들기 어려워지는 로봇 자세.'],['VLA','영상·언어 등 관측에서 행동 표현을 출력하는 모델.'],['월드 모델','행동 뒤 세상이 어떻게 바뀔지 예측하는 모델. 실측의 대체나 필수 만능 부품은 아님.']];
function sourcesPage(){return title('07 / GLOSSARY & SOURCES','어려운 말을 쉬운 말로','공식 기술 문서와 원논문을 중심으로 확인했습니다. 특정 최신 모델의 구매·성능 순위보다, 실제 구현에서 필요한 연결에 초점을 맞췄습니다.')+`<div class="card"><h2>기술 용어 사전</h2><table><tr><th>말</th><th>쉬운 뜻</th></tr>${glossary.map(r=>`<tr><td><strong>${r[0]}</strong></td><td>${r[1]}</td></tr>`).join('')}</table></div><div class="card"><h2>연구·공식 문서</h2><ol class="source-list">${DATA.sources.map(s=>`<li><a href="${s.url}" target="_blank" rel="noopener">${s.title}</a><p class="small muted">${s.note}</p></li>`).join('')}</ol></div><div class="card"><h3>자료의 범위</h3><p>확인일: 2026년 11월 1일. 연구 결과는 모든 현장에 동일하게 적용되지 않습니다. 보정·소리·환경·제동·제어 설명에는 로봇공학의 일반 원리와 교육용 설계 예를 함께 사용했습니다. 실물 로봇 시험이나 특정 장비의 성능 검증은 수행하지 않았습니다.</p><p>ROS 웹 문서 일부는 접근 제한이 있어 공식 저장소의 문서·메시지 정의를 함께 확인했습니다. 이 파일의 본문·그림·계산은 외부 라이브러리 없이 동작합니다.</p></div>`;}
function render(){ $('#nav').innerHTML=pages.map(([id,label],i)=>`<button type="button" data-page="${id}" ${state.page===id?'aria-current="page"':''}><span>0${i+1}</span>${label}</button>`).join('');const f={body:bodyPage,tasks:tasksPage,foundation:foundationPage,lab:labPage,brain:brainPage,build:buildPage,sources:sourcesPage};$('#content').innerHTML=(f[state.page]||bodyPage)()+footer();if(state.page==='lab')updateLab();if(state.page==='brain'){demo();$('#demoForm').addEventListener('submit',e=>{e.preventDefault();demo();});$('#demoCase').addEventListener('change',demo);} }
document.addEventListener('click',e=>{const b=e.target.closest('[data-page],[data-part],[data-skill],[data-task],[data-step]');if(!b||b.disabled)return;if(b.dataset.page)go(b.dataset.page);else if(b.dataset.part)go('body',b.dataset.part);else if(b.dataset.skill)jump(b.dataset.skill);else if(b.dataset.task!==undefined){state.task=Number(b.dataset.task);state.step=0;go('tasks');}else if(b.dataset.step!==undefined){state.step=Number(b.dataset.step);go('tasks');}});
document.addEventListener('keydown',e=>{const b=e.target.closest('g[data-part]');if(b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();go('body',b.dataset.part);}});
document.addEventListener('input',e=>{if(e.target.type==='range')updateLab();});
$('#search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();if(!q){render();return;}const hits=DATA.parts.flatMap(p=>p.skills.filter(s=>JSON.stringify(s).toLowerCase().includes(q)||p.name.toLowerCase().includes(q)).map(s=>({p,s})));const terms=glossary.filter(x=>x.join(' ').toLowerCase().includes(q));$('#content').innerHTML=title('SEARCH','궁금한 연결 찾기',`“${esc(e.target.value)}” · 감각·행동 ${hits.length}개 · 용어 ${terms.length}개`)+`<div class="search-results">${hits.map(({p,s})=>`<button data-skill="${s.id}"><span class="tag">${p.name}</span><strong>${s.title}</strong><p class="small muted">${s.child}</p></button>`).join('')||'<p>다른 말로 찾아보세요. 예: 관절, 거리, 접촉, 좌표, 채팅.</p>'}</div>${terms.length?'<div class="card"><h2>용어</h2>'+terms.map(t=>`<p><strong>${t[0]}</strong> · ${t[1]}</p>`).join('')+'</div>':''}`;});
function printPrepare(){const old={...state};let extra='';for(const pg of ['foundation','brain','build','sources']){state.page=pg;extra+=({foundation:foundationPage,brain:brainPage,build:buildPage,sources:sourcesPage}[pg])();}state=old;$('#printContent').innerHTML=title('ROBOT LEARNING ATLAS','로봇의 감각에서 행동까지','인쇄판 · 2026.11.01 · 교육용 연구 안내서')+DATA.parts.map(p=>`<section class="print-part"><h2>${p.name}</h2><p>${p.role}</p>${p.skills.map(s=>skillDetail(s,p,true)).join('')}</section>`).join('')+extra;$('#printContent').querySelectorAll('details').forEach(d=>d.open=true);}
$('#printBtn').addEventListener('click',()=>window.print());window.addEventListener('beforeprint',printPrepare);window.addEventListener('afterprint',()=>$('#printContent').innerHTML='');
function readHash(){const hash=new URLSearchParams(location.hash.slice(1));if(pages.some(p=>p[0]===hash.get('page')))state.page=hash.get('page');if(partBy(hash.get('part')))state.part=hash.get('part');state.skill=null;if(findSkill(hash.get('skill'))){state.skill=hash.get('skill');state.part=findSkill(state.skill).part;}$('#search').value='';render();}
window.addEventListener('hashchange',readHash);readHash();
</script></body></html>
