ns import defaultdict\n\ndef validate(records):\n    errors=[]; last={}; counts=defaultdict(int)\n    for line,row in enumerate(records,1):\n        if not isinstance(row,dict): errors.append(f'{line}: event must be an object'); continue\n        required=('episode_id','stream_id','measurement_time_ns','clock_id','frame_id','calibration_id','unit','value')\n        missing=[k for k in required if k not in row]\n        if missing: errors.append(f'{line}: missing {missing}'); continue\n        if any(not isinstance(row[k],str) or not row[k] for k in ('episode_id','stream_id','clock_id','frame_id','calibration_id','unit')):\n            errors.append(f'{line}: identifier and unit fields must be non-empty strings'); continue\n        stamp=row['measurement_time_ns']\n        if type(stamp) is not int or stamp<0: errors.append(f'{line}: invalid timestamp'); continue\n        key=(row['episode_id'],row['stream_id'],row['clock_id'])\n        if key in last and stamp<=last[key]: errors.append(f'{line}: non-increasing stream timestamp')\n        last[key]=stamp\n        val=row['value']\n        if not isinstance(val,list) or not val or not all(type(x) in (int,float) and math.isfinite(x) for x in val):\n            errors.append(f'{line}: value must be a non-empty finite numeric vector')\n        counts[row['stream_id']]+=1\n    return dict(events_by_stream=dict(counts),errors=errors,passed=not errors)\n\nif __name__=='__main__':\n    if len(sys.argv)!=2: raise SystemExit('Usage: python robot_data_quality.py events.jsonl')\n    try:\n        with open(sys.argv[1],encoding='utf-8') as f:\n            records=[json.loads(line) for line in f if line.strip()]\n        report=validate(records)\n        print(json.dumps(report,ensure_ascii=False,indent=2))\n        raise SystemExit(0 if report['passed'] else 1)\n    except (OSError,ValueError) as exc: raise SystemExit(str(exc))\n"};

function download(name,content,type='application/json'){const u=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000);}
function hero(k,t,p){return `<div class="hero"><div class="eyebrow">${k}</div><h1>${t}</h1><p>${p}</p></div>`;}
function sourceLinks(ids){return `<div class="source-inline">${ids.map(id=>resource(id)).filter(Boolean).map(r=>`<a href="${r.url}" target="_blank" rel="noopener">${r.title} ↗</a>`).join('')}</div>`;}
function bullets(a){return '<ul>'+a.map(x=>'<li>'+x+'</li>').join('')+'</ul>';}
function steps(a){return a.map((x,i)=>`<div class="step-line"><span class="num">${i+1}</span><p>${x}</p></div>`).join('');}
function table(head,rows){return `<div class="table-wrap" tabindex="0" role="region" aria-label="데이터 표: ${esc(head.join(', '))}"><table><thead><tr>${head.map(x=>'<th>'+x+'</th>').join('')}</tr></thead><tbody>${rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')}</tbody></table></div>`;}
function flow(items){return `<div class="flow">${items.map((x,i)=>`${i?'<i>→</i>':''}${Array.isArray(x)?`<button data-skill="${x[0]}">${x[1]}</button>`:`<span>${x}</span>`}`).join('')}</div>`;}
function moduleButton(id){const s=findSkill(id),p=partBy(s.part);return `<button class="module-card" data-skill="${id}"><span class="module-icon">${p.short.slice(0,1)}</span><div><h3>${s.title}</h3><p>${s.expert.goal}</p></div><span class="arrow">›</span></button>`;}
function resourceCard(r){return `<article class="resource"><div class="row"><span class="badge blue">${r.kind}</span><span class="small muted">${r.stage}</span></div><h3>${r.title}</h3><p>${r.use}</p><p class="muted"><strong>적용 전 연결 작업</strong><br>${r.adapt}</p><a href="${r.url}" target="_blank" rel="noopener">공식 자료 열기 ↗</a><div class="rights">${r.rights}<br>공식 페이지 확인 ${r.checked} · 개별 release/데이터 도입 검증은 별도</div></article>`;}
function go(page,part,skill){const old=state.page;state.page=page;if(part)state.part=part;state.skill=skill||null;state.query='';$('#search').value='';render();const h=new URLSearchParams({page:state.page,part:state.part});if(state.skill)h.set('skill',state.skill);history.replaceState(null,'','#'+h);if(old!==page)window.scrollTo(0,0);else if(page==='body'&&matchMedia('(max-width:950px)').matches)document.querySelector('.crumb')?.scrollIntoView({block:'start'});}
function jump(id){const s=findSkill(id);state.tab='overview';go('body',s.part,id);}
function homePage(){const roleModules={engineer:['frames','sync','depth','reach'],research:['logs','vla','slip','compliance'],product:['executive','stop','health','navigate']};return hero('ROBOT DATA ROADMAP / V2','감각을 데이터로,<br>데이터를 검증된 행동으로.','로봇·데이터·AI 팀이 같은 기준으로 설계하고 구현하도록 만든 실무 레퍼런스입니다. 기능 설명에서 시작해 데이터 계약, 구현 절차, 실패 진단, 평가 산출물까지 연결합니다.')+`<div class="grid3"><div class="card"><div class="metric-value">26<span style="font-size:15px;color:#6b7684"> 개 모듈</span></div><div class="metric-label">감각·판단·동작·운영</div><button class="link-button" data-page="body">실무 기술 맵 보기 →</button></div><div class="card"><div class="metric-value">${DATA.resources.length}<span style="font-size:15px;color:#6b7684"> 개 자료</span></div><div class="metric-label">공식 코드·데이터·시뮬레이터</div><button class="link-button" data-page="resources">적용 조건으로 찾기 →</button></div><div class="card"><div class="metric-value">8<span style="font-size:15px;color:#6b7684"> 개 실행 단계</span></div><div class="metric-label">작업 정의부터 현장 확장까지</div><button class="link-button" data-page="roadmap">내 프로젝트 계획하기 →</button></div></div><section class="section"><div class="grid2"><div class="card dark"><span class="badge">REFERENCE ARCHITECTURE</span><h2 style="margin-top:16px">공통 언어가 되는<br>데이터 계약부터</h2><p class="muted">측정값에는 단위·좌표·시각·오차·보정 버전이 필요합니다. 인식 모델의 점수와 실제 손끝 정밀도를 연결해 보세요.</p><button class="btn" data-page="contracts">계약과 오차 예산 보기</button></div><div class="card"><span class="badge green">START WITH A TASK</span><h2 style="margin-top:16px">작업 하나를 골라<br>끝까지 연결하세요</h2><p class="muted">컵 옮기기·정밀 삽입·이동·문 열기·표면 작업에서 필요한 모듈과 전제 조건을 추적합니다.</p><button class="btn ghost" data-page="tasks">작업 설계 열기</button></div></div></section><section class="section"><div class="section-head"><h2>내 역할에서 시작하기</h2><span class="small muted">추천 탐색 경로</span></div><div class="tabs" aria-label="업무 역할">${[['engineer','로봇·시스템 개발'],['research','데이터·AI 연구'],['product','제품·사업 운영']].map(([id,t])=>`<button data-role="${id}" class="${state.role===id?'active':''}" aria-pressed="${state.role===id}">${t}</button>`).join('')}</div><div class="grid2">${roleModules[state.role].map(moduleButton).join('')}</div></section><section class="section card"><h2>이 로드맵에서 만드는 산출물</h2>${flow(['작업 명세','센서·행동 계약','보정 묶음','원본 replay','학습 episode','평가 보고서','배포·복구 기록'])}<p class="muted small">문서의 수치는 측정 결과가 아닙니다. 프로젝트별 허용 오차·성공률·지연·원가를 정하고 실제 장비와 분리 평가로 확인합니다.</p></section>`;}

cx="126" cy="389" r="14"/><circle class="robot-joint" cx="185" cy="389" r="14"/><path class="robot-base" d="M111 404h30v30h8v13h-48v-13h10zM171 404h29v30h12v13h-48v-13h7z"/>${hot.map(([id,x,y,label])=>`<g class="hotspot ${state.part===id?'active':''}" data-part="${id}" role="button" tabindex="0" aria-label="${partBy(id).name}" aria-pressed="${state.part===id}"><circle cx="${x}" cy="${y}" r="21"/><text x="${x}" y="${y+4}" text-anchor="middle">${label}</text></g>`).join('')}</svg>`;}

function bodyPage(){const p=partBy(state.part),s=p.skills.find(x=>x.id===state.skill);return hero('CAPABILITY ATLAS','감각·행동 기술 맵','부위에서 기능을 고르면 실무 목표, 입력 계약, 구현 순서와 평가·진단을 확인할 수 있습니다. 쉬운 설명은 각 모듈의 보조 설명에 남겼습니다.')+`<div class="body-grid"><section class="robot-panel" aria-label="기능 부위 선택">${robot()}<div class="part-links">${DATA.parts.map(p=>`<button data-part="${p.id}" class="${state.part===p.id?'active':''}" aria-pressed="${state.part===p.id}">${p.name.split(' · ')[0]} · ${p.short}</button>`).join('')}</div><p class="small muted" style="margin-top:16px">몸은 탐색을 위한 비유입니다.<br>실제 시스템은 기능과 인터페이스로 구성합니다.</p></section><section><div class="crumb"><button data-part="${p.id}">${p.name}</button>${s?' / '+s.title:''}</div>${s?modulePage(s,p):`<div class="card"><span class="badge blue">${p.short}</span><h2 style="margin-top:13px">${p.name}</h2><p class="muted">${p.role}</p></div><div class="list">${p.skills.map(x=>moduleButton(x.id)).join('')}</div><div class="callout"><p><strong>권장 연결:</strong> 위치 관측 → 보정·시간 연결 → 도달성·경로 → 접촉 제어 → 결과 검사.</p></div>`}</section></div>`;}
function modulePage(s,p){const e=s.expert;const tabs=[['overview','실무 개요'],['contract','데이터 계약'],['implementation','구현·보정'],['validation','검증·진단'],['references','도구·근거']];let content='';if(state.tab==='overview')content=`<div class="card"><h3>구현 목표</h3><p class="lead">${e.goal}</p><h3 style="margin-top:24px">이 모듈이 연결하는 것</h3>${table(['들어오는 정보','모양·단위','역할'],s.rows)}<div class="callout"><strong>다음 모듈에 전달</strong><p>${s.action}</p></div><h3>완료 시 남겨야 할 산출물</h3>${bullets(e.artifacts)}<details><summary>직관적으로 이해하기</summary><div><p>${s.child}</p><p class="muted">현장 예: ${s.example}</p></div></details></div>`;
if(state.tab==='contract')content=`<div class="card"><h3>모듈 입력·출력 계약</h3><p class="small muted">프로젝트 설계를 위한 필드 예입니다. 실제 ROS 메시지·제조사 SDK와 매핑해야 하며 아래 이름이 표준 API라는 뜻은 아닙니다.</p>${table(['필드','타입·단위','의미','검사할 조건'],e.fields.map(r=>[ '<code>'+r[0]+'</code>',...r.slice(1)]))}<div class="callout"><strong>모든 스트림의 공통 봉투</strong><p><code>episode_id, stream_id, measurement_time_ns, receive_time_ns, clock_id, frame_id, calibration_id, schema_version</code> + 단위·유효성·불확실성·데이터 출처.</p></div><p><strong>결측 처리:</strong> 누락·invalid·out-of-range·센서 고장을 구분합니다. 결측을 물리량 0으로 대체하지 않습니다.</p><p><strong>제어율:</strong> 센서 rate, 모델 inference rate, action chunk, 드라이버 update rate를 구분해 장비와 오차 예산으로 정합니다.</p><button class="btn primary" data-export-module="${s.id}">이 모듈 계약 JSON 내려받기</button></div>`;
if(state.tab==='implementation')content=`<div class="card"><h3>구현 순서</h3>${steps(e.steps)}${e.formula?'<div class="callout"><strong>계산·표현에서 지킬 규약</strong><p>'+e.formula+'</p></div>':''}<h3 style="margin-top:24px">기존 데이터에서 빠지기 쉬운 것</h3><p>${s.missing}</p><h3>학습과 결정론적 구현의 선택</h3><p>${s.learn}</p><p class="muted small">정확한 기준선부터 재현한 뒤 학습 모델이 해결할 결손을 정합니다. 장비·ROS·CUDA·시뮬레이터 버전은 호환표와 commit으로 고정하세요.</p>${sourceLinks(e.tools)}</div>`;
if(state.tab==='validation')content=`<div class="card"><h3>통과 기준에 넣을 측정 지표</h3>${bullets(e.metrics)}<div class="callout"><p>지표 이름만으로 통과가 정해지지 않습니다. 사용 조건·측정 방법·표본 수·허용값·신뢰 구간을 작업 요구에서 결정하고 기록합니다.</p></div><h3>증상 → 점검할 원인</h3>${table(['실패 증상','진단 출발점'],e.faults)}<h3 style="margin-top:24px">필수 검증 산출물</h3>${bullets(e.artifacts)}<button class="btn ghost" data-page="evaluation">평가 설계와 계산 도구 열기 →</button></div>`;
if(state.tab==='references')content=`<div class="resource-grid">${e.tools.map(resource).filter(Boolean).map(resourceCard).join('')}</div><div class="card section"><h3>기존 해설의 연구 근거</h3>${s.refs.map(i=>`<p><a target="_blank" rel="noopener" href="${DATA.sources[i].url}">${DATA.sources[i].title} ↗</a><br><span class="small muted">${DATA.sources[i].note}</span></p>`).join('')}<p class="small muted">구현 절차와 검증 항목은 문헌·공식 인터페이스를 바탕으로 구성한 설계 제안입니다. 해당 환경의 실제 결과로 검증해야 합니다.</p></div>`;
return `<div class="hero-row"><div><span class="badge blue">ENGINEERING MODULE</span><h2 style="margin-top:12px">${s.title}</h2></div><div class="row"><button class="btn" data-bookmark="${s.id}" aria-pressed="${saved.bookmarks.includes(s.id)}">${saved.bookmarks.includes(s.id)?'저장됨 ✓':'모듈 저장'}</button><button class="btn ghost" data-part="${p.id}">목록</button></div></div><div class="tabs" aria-label="모듈 상세 내용">${tabs.map(([id,t])=>`<button data-tab="${id}" class="${state.tab===id?'active':''}" aria-pressed="${state.tab===id}">${t}</button>`).join('')}</div>${content}`;}
const TASKS=[

function evaluationPage(){return hero('VALIDATION WORKBENCH','모델 점수를 작업 품질로 연결하기','단일 성공률 대신 조건·표본·실패·지연·원가를 함께 봅니다. 아래 계산은 설계 보조이며 실측 보고서를 대신하지 않습니다.')+`<div class="card"><h2>평가 매트릭스</h2>${table(['범위','분리할 조건','측정'],[['인식·기하','조명·거리·재질·가림·배치','precision/recall·pose error·valid ratio·지연'],['제어·접촉','하중·마찰·공차·속도·기구 변화','TCP 오차·peak force·overshoot·미끄러짐'],['전체 작업','준비·실행·검사·복구 포함','업무 성공·오완료·손상·개입·cycle time'],['운영','장시간·센서 누락·통신·재시작','deadline miss·MTTR·복귀·에너지·재작업'],['전이','물체·장소·날짜·장비 홀드아웃','기준선 대비 성능·새 실패·재학습 비용']])}<div class="callout"><p><strong>분모를 고정하세요.</strong> 전체 요청, 실행 가능 요청, 실제 실행, 성공 실행을 구분하고 중단·사람 개입·재시도를 어떻게 세는지 명시합니다. 정책의 동일한 실패를 반복해 표본 수만 늘리는 평가를 피합니다.</p></div></div><div class="grid2 section"><div class="card"><h3>성공률의 불확실성</h3><p class="small muted">성공/실패가 독립이며 같은 성공 확률을 가진다는 이항 가정의 Wilson 95% 구간입니다. 현장·물체별 의존성이 크면 별도 층화·군집 평가가 필요합니다.</p><div class="form-grid">${input('trials','시험 수 n',100,1,1000000)}${input('successes','성공 수 x',90,0,1000000)}</div><div class="calc-result" id="wilsonResult" aria-live="polite"></div></div><div class="card"><h3>시간 정렬 오차 근사</h3><p class="small muted">일정 속도·작은 회전의 1차 상계 근사. 회전 방향·센서 위치·가속·제어 추종 등은 실제 시스템 모델로 검증해야 합니다.</p><div class="form-grid">${input('velocity','병진 속도 m/s',0.5,0,100,0.1)}${input('skew','시간 스큐 ms',20,0,10000,1)}${input('omega','각속도 rad/s',0.5,0,100,0.1)}${input('lever','회전축에서 센서 거리 m',0.2,0,100,0.1)}</div><div class="calc-result" id="errorResult" aria-live="polite"></div></div></div><div class="section card"><h2>실패 분석을 개선 요청으로</h2>${table(['관측된 실패','먼저 분리할 원인','우선 조치'],[['손이 항상 같은 만큼 빗나감','보정·축·TCP 편향','독립 타깃 재검증, 모델 학습 전에 기하 수정'],['움직일 때만 어긋남','시각·회전·rolling shutter·추종','측정/수신 시각·TF·모터 상태 비교'],['잡았지만 운반 중 낙하','힘·마찰·가속·접촉 위치','파지 envelope와 동적 검증'],['학습 점수 높고 새 현장에서 실패','leakage·분포·action mismatch','분할·normalization·adapter 재검사'],['끝났다고 했지만 결과가 틀림','ACK와 업무 완료 혼동','독립 verifier와 증거 저장']])}</div><div class="section card"><h2>제품·사업 관점의 지표</h2><p>시연 성공에서 운영 가치로 이어지는 비용을 측정합니다. 하드웨어 감가·준비·설치·정비·지원·실패 비용을 함께 봅니다.</p><pre>성공 업무당 비용 ≈ (운용 + 사람 개입 + 재작업 + 에너지 + 유지 비용) / 검증된 성공 수
관측된 MTTR = 복구 소요시간 합 / 완료된 복구 사건 수
※ 고정비·설치비·장비 수명·수요와 용량은 별도 사업 모델에서 포함</pre><p class="small muted">ROI나 상장 가능성을 계산하는 보장 모델은 아닙니다. 관측한 업무 효용과 확대 시 원가 구조를 구분하세요.</p></div>`;}
function updateCalcs(){const v=id=>Number($('#'+id)?.value);if($('#storageResult')){const values=['camW','camH','camFps','camCount','hours'].map(v);if(values.some(x=>!Number.isFinite(x)||x<=0)){$('#storageResult').textContent='양수 값을 입력하세요.';}else{const rate=v('camW')*v('camH')*5*v('camFps')*v('camCount'),bytes=rate*v('hours')*3600;$('#storageResult').innerHTML=`<strong>${(bytes/1e9).toFixed(1)} GB</strong><p>원시 입력 ${(rate/1e6).toFixed(1)} MB/s · RGB 3 B + depth 2 B / pixel · decimal 단위<br><span class="small muted">압축·중복 저장·기록 overhead가 없는 계산값입니다.</span></p>`;}}if($('#wilsonResult')){const n=v('trials'),x=v('successes');if(!Number.isInteger(n)||!Number.isInteger(x)||n<1||x<0||x>n){$('#wilsonResult').textContent='정수 조건 0 ≤ x ≤ n, n ≥ 1을 확인하세요.';}else{const z=1.96,p=x/n,d=1+z*z/n,c=(p+z*z/(2*n))/d,h=z*Math.sqrt(p*(1-p)/n+z*z/(4*n*n))/d;$('#wilsonResult').innerHTML=`<strong>${(p*100).toFixed(1)}%</strong><p>95% 구간 ${(Math.max(0,c-h)*100).toFixed(1)}–${(Math.min(1,c+h)*100).toFixed(1)}%<br><span class="small muted">입력 ${x}/${n}에 대한 계산값 · 측정 성과 아님</span></p>`;}const dt=v('skew')/1000,t=v('velocity')*dt,r=v('omega')*v('lever')*dt;if([dt,t,r].some(x=>!Number.isFinite(x)||x<0))$('#errorResult').textContent='유효한 0 이상 값을 입력하세요.';else $('#errorResult').innerHTML=`<strong>${((t+r)*1000).toFixed(1)} mm</strong><p>병진 ${(t*1000).toFixed(1)} mm + 회전 기여 근사 ${(r*1000).toFixed(1)} mm<br><span class="small muted">시간 스큐로 인한 기여만 계산. 전체 손끝 오차 아님.</span></p>`;}}
function resourcesPage(){const filtered=DATA.resources.filter(r=>(state.kind==='전체'||r.kind===state.kind)&&(state.stage==='전체'||r.stage===state.stage));return hero('OPEN ECOSYSTEM','목적에 맞는 코드와 데이터를 고르세요','공식 프로젝트·문서·공공 플랫폼을 기준으로 연결했습니다. 공개 접근, 오픈소스 코드, 데이터 이용권, 가중치 라이선스는 서로 다릅니다.')+`<div class="filter-bar"><label class="small">자료 유형 <select id="kindFilter" aria-label="자료 유형">${['전체',...new Set(DATA.resources.map(r=>r.kind))].map(x=>`<option ${state.kind===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="small">적용 단계 <select id="stageFilter" aria-label="적용 단계">${['전체',...new Set(DATA.resources.map(r=>r.stage))].map(x=>`<option ${state.stage===x?'selected':''}>${x}</option>`).join('')}</select></label><span class="badge" style="align-self:center">${filtered.length}개 자료</span></div><div class="resource-grid">${filtered.map(resourceCard).join('')||'<p class="empty">조건에 맞는 자료가 없습니다. 필터를 바꿔 주세요.</p>'}</div><div class="card section"><h2>“공개되어 있다”에서 “우리 로봇에 쓴다”까지</h2>${steps(['코드·가중치·원천 데이터·asset 각각의 이용 조건 확인','로봇 몸·카메라·관측/action 의미·단위·주기 확인','샘플로 포맷·접촉/힘 등 필수 모달리티 가용성 검사','변환 adapter와 고정된 실행 환경으로 기준선 재현','별도 현장 데이터에서 성능·개입·원가 평가'])}<p class="small muted">자료 전체를 무제한·무조건 이용할 수 있다는 뜻이 아닙니다. 이 카탈로그는 기능·적용 지점을 확인한 연구 스냅샷이며, 저장소 전체의 품질·권리·보안·장비 호환성을 감사한 결과는 아닙니다.</p></div>`;}
const GATES=[['작업과 성공 정의','목표·환경·물체·완료 검사·실패 비용·허용 오차를 적습니다.','작업 명세 / 측정 가능한 acceptance criteria','executive'],['몸·도구·운용 조건','도달 거리·하중·개도·제어 모드·정지/유지 의미를 확인합니다.','장비 능력 표 / TCP·payload·기구 버전','joints'],['센서·보정·시간 계약','frame·clock·단위·결측·오차·health를 묶고 독립 타깃으로 검증합니다.','데이터 계약 / calibration bundle / 오차 보고서','frames'],['기본 동작과 피드백','지정된 목표로 접근·접촉·동작·검사를 연결하고 실패를 기록합니다.','상태 전이 / 실제 목표·추종 replay','reach'],['수집·정렬·기준선','원본·episode·action 의미·split·normalization을 고정합니다.','QC 결과 / dataset card / baseline','logs'],['정책·에이전트 통합','필요한 부분에 학습·LLM을 더하고 권한·전제·cancel을 검사합니다.','고정 revision / tool contract / 재시도·복구','vla'],['분리 평가와 장애 시험','새 조건·센서 누락·통신·재시작·손상·개입을 평가합니다.','평가 행렬 / fault injection / 비용','stop'],['운영·유지·현장 확장','모델·보정·기구·설정 묶음으로 배포하고 이전 버전 복귀와 재사용을 확인합니다.','배포·정비 기록 / 두 번째 현장 결과','health']];
function roadmapPage(){const n=saved.gates.length;return hero('PROJECT WORKSPACE','기술 지식을 프로젝트 산출물로','단계마다 확인한 산출물을 남기세요. 체크는 사용자의 진행 기록이며 숙련도·제품 준비도·인증을 판정하지 않습니다.')+`<div class="grid2"><div class="card"><h2>프로젝트 정의</h2><label class="field">첫 작업<input data-project="task" value="${esc(saved.project.task)}"></label><label class="field">완료할 결과<textarea data-project="goal" placeholder="관측으로 판정할 결과">${esc(saved.project.goal)}</textarea></label><label class="field">운용 조건·제약<textarea data-project="constraints" placeholder="장비·물체·환경·속도·하중·범위">${esc(saved.project.constraints)}</textarea></label><label class="field">통과 기준과 측정 방법<textarea data-project="acceptance" placeholder="목표값·시험 조건·표본·실패 처리 기준">${esc(saved.project.acceptance)}</textarea></label><button class="btn primary" data-download="project" style="margin-top:17px">계획 JSON 내보내기</button></div><div class="card"><span class="badge green">LOCAL PROGRESS</span><h2 style="margin-top:15px">${n} / 8 단계 확인</h2><div class="bar"><span style="width:${n/8*100}%"></span></div><p class="small muted" style="margin-top:14px">현재 브라우저의 로컬 저장소에 기록합니다. 파일 URL·브라우저 정책에 따라 저장이 제한될 수 있으므로 계획을 내보내 보관하세요.</p><h3 style="margin-top:25px">저장한 모듈</h3>${saved.bookmarks.length?saved.bookmarks.map(id=>findSkill(id)).filter(Boolean).map(s=>`<p><button class="link-button" data-skill="${s.id}">${s.title} →</button></p>`).join(''):'<p class="muted">모듈의 ‘저장’ 버튼으로 다시 볼 자료를 모으세요.</p>'}<div class="callout"><p>구현자는 계약·제어·복구를, 연구자는 데이터·기준선·전이를, 제품 담당자는 업무 결과·개입·설치·원가를 함께 확인합니다.</p></div></div></div><div class="card section"><h2>실행 단계</h2>${GATES.map((g,i)=>`<div class="milestone"><span class="num">${i+1}</span><div><h3>${g[0]}</h3><p class="muted">${g[1]}</p><p><span class="badge">산출물</span> ${g[2]}</p><button class="link-button" data-skill="${g[3]}">관련 모듈 열기 →</button></div><label><input type="checkbox" data-gate="${i}" ${saved.gates.includes(i)?'checked':''} aria-label="${g[0]} 확인"></label></div>`).join('')}</div>`;}
const terms=[['데이터 계약','필드·단위·좌표·시각·결측·행동 의미·버전을 생산자와 소비자가 합의한 규칙.'],['SE(3)','3차원 위치와 회전을 함께 다루는 강체 변환.'],['TCP','도구가 실제 작업하는 기준점. 플랜지 위치와 다름.'],['공분산','추정 오차의 분산과 축 사이 관계. 임의 confidence 점수와 구분.'],['자기수용감각','관절·속도·힘 등 자기 몸 상태의 관측.'],['역운동학','목표 손 자세에 맞는 관절 자세 계산. 해가 없거나 여러 개일 수 있음.'],['특이점','일부 손끝 운동이 어려워져 관절 속도·힘 전달이 불리해지는 자세.'],['임피던스/어드미턴스','목표 운동과 접촉력의 관계를 제어하는 방식. 장비 지원 모드·안정성 검증 필요.'],['SLAM/위치 추정','지도와 위치를 함께 추정하는 일 / 알려진 지도에서 위치를 추정하는 일.'],['행동 공간','관절·속도·토크·절대/상대 자세 등 정책 출력의 의미와 규약.'],['BC','시연 관측에서 시연 행동을 예측하는 모방학습 기준선.'],['VLA','시각·언어 등 관측에서 로봇 행동 표현을 출력하는 모델.'],['OOD','학습·검증 범위와 다른 환경·물체·관측·동작 조건.'],['Action chunk','여러 시점의 행동 묶음. 지연을 줄일 수 있지만 중간 관측과 취소를 설계해야 함.'],['Lineage','원본→가공→학습→배포에 사용된 자료·보정·코드·설정의 계보.'],['Acceptance criteria','어떤 조건·방법·값으로 통과를 판정할지 정한 기준.'],['p95/p99','관측된 지연 등 값의 95/99 백분위. 평균과 구분해 꼬리 지연을 관찰.'],['MTTR','실제 정의한 복구 사건의 평균 복구 시간. 사건 정의와 미완료 처리 규칙 필요.']];
function sourcesPage(){return hero('EDITORIAL & EVIDENCE','근거와 설계 제안을 함께 읽으세요','공식 문서·원논문·프로젝트를 바탕으로 작성한 실무 로드맵입니다. 재현 가능한 프로젝트 산출물로 연결하되 현장 검증이 필요한 경계를 표시했습니다.')+`<div class="card"><h2>자료 상태와 범위</h2>${table(['내용','해석'],[['공식 문서·원논문','기능·필드·방법의 근거. 특정 작업 성능 보장은 아님.'],['모듈 구현·평가·계약','여러 자료와 일반 공학 원리를 연결한 편집·설계 제안. 프로젝트별 구체화 필요.'],['계산기·샘플 코드','가정을 명시한 설계 보조. 실제 로봇 연결·제어 기능 없음.'],['공개 리소스','기능과 적용 지점 중심 확인. 전체 코드 감사·권리 검토·환경 설치 시험은 아님.'],['프로젝트 체크','사용자가 직접 기록한 진행 상태. 자동 적합성 판정 아님.']])}<p class="small muted" style="margin-top:15px">확인 기준 ${DATA.checked}. 특정 최신 버전이나 모델을 항상 추천하는 서비스가 아닙니다. 설치 시 release·의존성·하드웨어 지원과 데이터 사용 조건을 다시 고정하세요.</p></div><div class="card section"><h2>공학 용어 사전</h2>${table(['용어','정의·주의점'],terms)}</div><div class="card section"><h2>원문과 근거</h2>${DATA.sources.map((s,i)=>`<p><span class="badge">${i+1}</span> <a href="${s.url}" target="_blank" rel="noopener">${s.title} ↗</a><br><span class="small muted">${s.note}</span></p>`).join('')}<p><a href="https://www.aihub.or.kr/intrcn/guid/usagepolicy.do?currMenu=151&topMenu=105" target="_blank" rel="noopener">AI-Hub 이용정책 ↗</a></p><button class="btn ghost" data-page="resources">${DATA.resources.length}개 구현 자료 카탈로그 →</button></div>`;}
const views={home:homePage,body:bodyPage,tasks:tasksPage,contracts:contractsPage,pipeline:pipelinePage,brain:brainPage,evaluation:evaluationPage,resources:resourcesPage,roadmap:roadmapPage,sources:sourcesPage};
function render(){ $('#nav').innerHTML=pages.map(([id,t],i)=>`<button data-page="${id}" ${state.page===id?'aria-current="page"':''}><span class="nav-index">${String(i+1).padStart(2,'0')}</span>${t}</button>`).join('');$('#path').textContent='Roadmap / '+(pages.find(p=>p[0]===state.page)?.[1]||'Overview');$('#content').innerHTML=(views[state.page]||homePage)()+`<footer class="footer">ROBOT DATA ROADMAP · ${DATA.revision} · ${DATA.checked}<br>오프라인 레퍼런스 / 실제 장비·AI API와 연결되지 않음 / 공식 외부 링크는 인터넷 필요</footer>`;updateCalcs();}
function projectExport(){download('robot-project-plan.json',JSON.stringify({schema_version:'roadmap-project-1',exported_at:new Date().toISOString(),project:saved.project,gates:GATES.map((g,i)=>({stage:i+1,title:g[0],artifact:g[2],checked:saved.gates.includes(i)})),bookmarks:saved.bookmarks,source_snapshot:DATA.checked,notice:'User-maintained planning record; not a readiness or safety certification.'},null,2));}
function downloadItem(type){if(type==='project')return projectExport();if(type==='qc')return download('robot_data_quality.py',DATA.qc_code,'text/x-python');if(type==='sample')return download('events.sample.jsonl',sampleEvents().map(x=>JSON.stringify(x)).join('\n')+'\n','application/x-ndjson');if(type==='manifest')return download('robot-dataset-manifest.template.json',JSON.stringify({schema_version:'project-manifest-1',task_definition:'FILL_ME',robot_revision:'FILL_ME',calibration_id:'FILL_ME',clock_domains:[],action_spec:{representation:'FILL_ME',frame:'FILL_ME',units:'FILL_ME',gripper_convention:'FILL_ME',horizon:'FILL_ME'},raw_files:[],split_unit:'episode/site/date/object; define holdout policy',normalization_fit:'train_only',rights_records:[],qc_report:'FILL_ME'},null,2));}
function sampleEvents(){return [1000000000,1020000000].map((t,i)=>({episode_id:'demo-001',stream_id:'object_position',measurement_time_ns:t,clock_id:'example_device_clock',frame_id:'robot_base',calibration_id:'example-calib-v1',unit:'m',value:[0.4+i*0.01,0.1,0.2]}));}
document.addEventListener('click',e=>{const b=e.target.closest('[data-page],[data-part],[data-skill],[data-tab],[data-role],[data-task],[data-step],[data-bookmark],[data-export-module],[data-download]');if(!b||b.disabled)return;const d=b.dataset;if(d.page)go(d.page);else if(d.part)go('body',d.part);else if(d.skill)jump(d.skill);else if(d.tab){state.tab=d.tab;render();}else if(d.role){state.role=d.role;render();}else if(d.task!==undefined){state.task=Number(d.task);state.step=0;render();}else if(d.step!==undefined){state.step=Number(d.step);render();}else if(d.bookmark){saved.bookmarks=saved.bookmarks.includes(d.bookmark)?saved.bookmarks.filter(x=>x!==d.bookmark):[...saved.bookmarks,d.bookmark];persist();render();toast(saved.bookmarks.includes(d.bookmark)?'모듈을 저장했습니다.':'저장을 해제했습니다.');}else if(d.exportModule){const s=findSkill(d.exportModule);download('robot-contract-'+s.id+'.json',JSON.stringify({schema_version:'roadmap-module-draft-1',module:s.id,title:s.title,goal:s.expert.goal,fields:s.expert.fields.map(([name,type,meaning,check])=>({name,type,meaning,check})),required_common_metadata:['episode_id','stream_id','measurement_time_ns','clock_id','frame_id','calibration_id','schema_version'],metrics:s.expert.metrics,acceptance_thresholds:'Define from task and validation protocol',sources:s.expert.tools.map(resource).map(r=>({title:r.title,url:r.url})),notice:'Design template, not a ROS message definition or executable robot configuration.'},null,2));}else if(d.download)downloadItem(d.download);});
document.addEventListener('keydown',e=>{const g=e.target.closest('g[data-part]');if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault();go('body',g.dataset.part);}});
document.addEventListener('change',e=>{if(e.target.id==='kindFilter'){state.kind=e.target.value;render();}if(e.target.id==='stageFilter'){state.stage=e.target.value;render();}if(e.target.dataset.gate!==undefined){const i=Number(e.target.dataset.gate);saved.gates=e.target.checked?[...new Set([...saved.gates,i])]:saved.gates.filter(x=>x!==i);persist();render();}});
document.addEventListener('input',e=>{if(e.target.dataset.project){saved.project[e.target.dataset.project]=e.target.value;persist();}if(e.target.type==='number')updateCalcs();});
$('#search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();if(!q){render();return;}state.query=q;const modules=allSkills().filter(s=>JSON.stringify(s).toLowerCase().includes(q)),rs=DATA.resources.filter(r=>JSON.stringify(r).toLowerCase().includes(q)),ts=terms.filter(t=>t.join(' ').toLowerCase().includes(q));$('#content').innerHTML=hero('SEARCH','모듈·도구·실패 증상 찾기',`“${esc(e.target.value)}” · 모듈 ${modules.length} · 자료 ${rs.length} · 용어 ${ts.length}`)+`<div class="list">${modules.map(s=>`<button class="search-hit" data-skill="${s.id}"><span class="badge blue">${partBy(s.part).name}</span><strong style="margin:8px 0">${s.title}</strong><span class="muted small">${s.expert.goal}</span></button>`).join('')}</div>${rs.length?'<div class="section resource-grid">'+rs.map(resourceCard).join('')+'</div>':''}${ts.length?'<div class="card section">'+table(['용어','뜻'],ts)+'</div>':''}${!modules.length&&!rs.length&&!ts.length?'<p class="empty">다른 용어·실패 증상으로 찾아보세요.</p>':''}`;});
$('#exportProject').addEventListener('click',projectExport);
function preparePrint(){const print=DATA.parts.map(p=>`<section class="pagebreak"><h1>${p.name}</h1>${p.skills.map(s=>`<div class="card"><h2>${s.title}</h2><p>${s.expert.goal}</p><h3>데이터 계약</h3>${table(['필드','타입','의미','검사'],s.expert.fields)}<h3>구현</h3>${steps(s.expert.steps)}<h3>평가</h3>${bullets(s.expert.metrics)}<h3>실패 진단</h3>${table(['증상','진단'],s.expert.faults)}<h3>산출물</h3>${bullets(s.expert.artifacts)}${sourceLinks(s.expert.tools)}</div>`).join('')}</section>`).join('');$('#printContent').innerHTML=hero('ENGINEERING EDITION','로봇 데이터 로드맵',`인쇄판 · ${DATA.checked} · 설계·검증용 레퍼런스`)+print+contractsPage()+pipelinePage()+brainPage()+sourcesPage();}
$('#printBtn').addEventListener('click',()=>window.print());window.addEventListener('beforeprint',preparePrint);window.addEventListener('afterprint',()=>$('#printContent').innerHTML='');
function readHash(){const h=new URLSearchParams(location.hash.slice(1));if(pages.some(p=>p[0]===h.get('page')))state.page=h.get('page');else if(h.get('page')==='foundation')state.page='contracts';else if(h.get('page')==='build')state.page='roadmap';else if(h.get('page')==='lab')state.page='evaluation';if(partBy(h.get('part')))state.part=h.get('part');state.skill=null;if(findSkill(h.get('skill'))){state.skill=h.get('skill');state.part=findSkill(state.skill).part;state.page='body';}$('#search').value='';render();}
window.addEventListener('hashchange',readHash);readHash();
</script></body></html>
